# Checks that every pull request the forge says it merged is actually on main.
#
# Twice on 2026-09-14, on lokalverket-no, it was not. A merge landed, main moved
# back, and the merge commit was left unreachable - correct parents, correct
# content, on no branch. Every signal reported success: the PR said merged=true
# with a correct merge_commit_sha, the linked issue auto-closed, the head branch
# was deleted by the cleanup job (which guards on merged == true and cannot
# know), and the push CI run for the orphaned commit itself went green. Both
# were caught by a person reading `git log` and knowing which merge commit to
# expect.
#
# It also answers a second question of the same kind, added when the branch
# sweep landed (#29): did the sweep actually run? The sweep is the backstop
# for a merge whose delete event never arrived, and it has the same blind spot
# one layer up - if its timer stops firing, nothing says so and the branches
# pile up in silence. It lives here rather than on a timer of its own because
# a watchdog with its own schedule needs its own watchdog, and this job
# already runs daily for a neighbouring reason.
#
# This job is that habit, made not-a-habit. It does not prevent the loss and
# does not explain it - the investigation is nixfleet #172 - it just refuses to
# let the loss be silent. rovar-no has no orphans today: all 13 merged pull
# requests were checked against origin/main when #34 was filed and every one was
# reachable. This is a watchdog, not a fix.
#
# Daily rather than per-merge on purpose: the failure is a ref being rolled back
# some time after the merge reports success, so a check that ran as part of the
# merge would be asking too early.
name: Merge audit

on:
  schedule:
    # 05:13 daily. Off the hour, and clear of the runner's other two slots -
    # link-check on Wednesdays at 06:00 and deps-update on the 6th and 20th at
    # 04:37. Capacity is 1 across seven repos. A 7-day window checked daily
    # gives any orphan seven chances to be seen before it ages out.
    - cron: '13 5 * * *'
  workflow_dispatch:

jobs:
  audit:
    runs-on: docker
    timeout-minutes: 10
    steps:
      # Full history: reachability is the whole question, and a shallow clone
      # answers it wrong rather than not at all. scripts/check-merged-prs.mjs
      # refuses to run on one, which is what makes getting this line wrong loud
      # instead of a page of false orphans.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Before the work, not after. A job that cannot reach the API should say
      # so in its first seconds rather than looking like a clean audit - which
      # is exactly the failure mode this job exists to remove.
      - name: FORGE_PR_TOKEN resolves
        env:
          PR_TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
        run: |
          set -eu
          if [ -z "${PR_TOKEN:-}" ]; then
            echo "FORGE_PR_TOKEN is empty or not visible to this repo."
            echo "It is an Actions secret at user scope. Reading pulls needs it;"
            echo "the automatic Actions token is answered 404 'Can not read pulls'."
            exit 1
          fi
          # Length only. The value must never reach a log: this one is readable
          # by anyone who can read the repo.
          echo "FORGE_PR_TOKEN resolved, ${#PR_TOKEN} characters"

      - name: Every merged PR is on main
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
        run: |
          set -eu
          # No `git fetch` here on purpose. This step used to refresh origin/main
          # in the shell first, which left every other way of running the script
          # - a local `npm run merges:check` most of all - judging against
          # whatever the clone last happened to fetch. A stale ref reports
          # correctly merged pull requests as orphaned, so the fetch lives in the
          # script now, where it cannot be forgotten.
          npm run merges:check

      # Last, and not gated on the step above: a lost merge and a dead sweep
      # are independent faults, and finding one must not hide the other. Both
      # steps fail the job, so a red tick means read the log rather than
      # assume which half it was.
      - name: The branch sweep is still running
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
        run: |
          set -eu
          npm run sweep:check

      # Third watchdog on the same forge, and the one that exists because the
      # second fix had a hole in it. After #45 the delete job retries when the
      # forge restores a branch, and the outcomes are asymmetric: a retry that
      # FAILS turns that job red and somebody sees it, while a retry that WORKS
      # ends green and is indistinguishable from a merge where nothing
      # happened. The measurement #44 is open for was the one nothing reported.
      #
      # Never fails this job. A working retry is good news and a broken one is
      # already red elsewhere; `continue-on-error` is not needed because the
      # script exits 0 either way, and that is deliberate rather than sloppy.
      #
      # TALLY_ISSUE is scaffolding for #44 and should be dropped with it - the
      # printed summary is the part worth keeping. Whether FORGE_PR_TOKEN can
      # write issue comments is unverified; the script prints the tally and
      # carries on if the POST is refused, so finding out costs nothing.
      - name: Did a branch delete need a retry
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TOKEN: ${{ secrets.FORGE_PR_TOKEN }}
          TALLY_ISSUE: '44'
        run: |
          set -eu
          npm run retries:check
