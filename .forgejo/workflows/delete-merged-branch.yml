# Deletes the head branch when a pull request merges. The forge-native way to
# do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo,
# where it can be read and changed without admin rights.
#
# Only branches under herd/ are touched, and only when the PR actually merged.
# A closed-unmerged PR, anyone else's branch and main are all left alone.
#
# Ported from bjorn/media-tools (issue #8, PR #9), which settled two things
# this copy relies on: the automatic github.token is allowed to delete a ref,
# so no secret is needed, and Forgejo runs the head ref's copy of a workflow
# for a `closed` event - so this fires on the very PR that adds it.
name: Delete merged branch

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    # The whole guard is here rather than in the script: a job that does not
    # run is clearer in the run list than a job that runs and decides to do
    # nothing.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'herd/')
    runs-on: docker
    timeout-minutes: 5
    steps:
      # media-tools runs this on the `python` label and uses urllib. This
      # repo's runner label is `docker` (node:22-bookworm), so the equivalent
      # "cannot be missing" tool is node's own global fetch - no install step,
      # no checkout, nothing to keep in sync with package.json.
      - name: Delete the head branch
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          node - <<'JS'
          const branch = process.env.BRANCH;
          // Each segment is escaped but the slashes are left alone: the API
          // route matches a branch name as a path, so herd%2Ffoo does not
          // resolve and answers 404 - which the handler below reads as
          // "already gone". Encoding the whole string would turn every run
          // green without deleting anything.
          const path = branch.split("/").map(encodeURIComponent).join("/");

          (async () => {
            const res = await fetch(`${process.env.API}/branches/${path}`, {
              method: "DELETE",
              headers: { Authorization: `token ${process.env.TOKEN}` },
            });

            if (res.ok) {
              console.log(`deleted ${branch} (${res.status})`);
              return;
            }
            // 404 means someone got there first - the merge dialog's own
            // checkbox, or a manual sweep. That is the desired end state, so
            // it is not a failure.
            if (res.status === 404) {
              console.log(`${branch} is already gone`);
              return;
            }
            // Anything else - a token that may not delete refs (403), a
            // protected branch (403), an API that moved - has to be loud. A
            // cleanup job that fails quietly just goes back to piling
            // branches up without saying so.
            console.log(`could not delete ${branch}: ${res.status} ${res.statusText}`);
            console.log(await res.text());
            process.exit(1);
          })().catch((err) => {
            // A fetch that throws never reached the forge at all. Same rule.
            console.log(`could not delete ${branch}: ${err.message}`);
            process.exit(1);
          });
          JS
