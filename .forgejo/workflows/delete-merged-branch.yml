# Deletes the head branch when a pull request merges. The forge-native way to
# do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo,
# where it can be read and changed without admin rights.
#
# Only branches under herd/ are touched, and only when the PR actually merged.
# A closed-unmerged PR, anyone else's branch and main are all left alone.
#
# EVERYTHING HERE HAPPENS OVER THE GIT TRANSPORT. That is the finding of
# nixfleet #172, not a preference: this forge records a ref update in its
# database that its git ref write did not apply. A DELETE answers 2xx and marks
# the branch row deleted while `refs/heads/<branch>` never moves. Measured on
# bjorn/lokalverket-no, where two branches deleted that way were still on the
# remote:
#
#   GET /git/refs/heads   ->  herd/check-tests, herd/deps-credential-precheck, main
#   GET /branches         ->  main
#
# The forge's own git layer had them; its branch table did not. So a job that
# asks the API whether the branch is gone is asking the party that has already
# been fooled - which is exactly how this file's #17 version logged `deleted`
# over a ref that was still there on PR #23.
#
# That also retires this file's previous header, which said the ref itself
# flaps and that therefore no read path settles the question. Three of the four
# failures on 2026-09-14 were the database being wrong while git was right and
# consistent throughout, and the git layer is the one both sides of a clone
# actually use.
#
#   #8   trusted the DELETE status   - Forgejo answers 500, not 404, for a
#                                      branch that is already gone
#   #17  checked with a REST GET     - on PR #23 the API said gone twice while
#                                      the ref survived
#   #28  checked with git ls-remote  - right surface, but it kept the API
#                                      DELETE as the thing doing the removal
#
# `git push --delete` is the only removal path with a clean record here: every
# stuck ref cleared by hand was cleared with it, #172's probing put 30 refs
# through in one push with the branch table staying in step, and it treats an
# already-gone ref benignly (a warning and exit 0) where the API answers 500.
#
# The API DELETE survives only as a fallback, for the one thing not verifiable
# from outside the runner: whether the automatic `github.token` may delete refs
# over git. It reads and writes code fine, so it should, but a cleanup job that
# stops working on an unproven assumption is worse than one carrying four extra
# lines. Whichever path removes the ref, the verification below is the same.
#
# Ported from bjorn/nixfleet's copy of this file, which came from
# bjorn/media-tools (its #8/#9). Same `docker` label as every other job here,
# which carries git and curl; nothing in this version parses JSON, so the
# node-versus-python question the old header argued is moot.
#
# For whoever debugs this next: job logs ARE readable, at
# `GET /actions/jobs/{job_id}/logs`. An earlier version of this comment said
# they were not, which cost an hour. The trap is that `job_id` is a different id
# space from the `id` in `/actions/tasks`, and passing a task id there returns
# some other job's log rather than 404ing. Map it with `GET /actions/runs?limit=N`
# for the run's `id`, then `GET /actions/runs/{id}/jobs` for `{id, task_id}`.
name: Delete merged branch

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    # The guard is here rather than in the script now that #15's reason for
    # keeping it there is spent: a job that does not run is clearer in the run
    # list than a job that runs and decides to do nothing. `/actions/tasks` has
    # a `status` and no `conclusion`, so a skipped and a successful job still
    # read the same from that listing - map the run to its jobs instead.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'herd/')
    runs-on: docker
    timeout-minutes: 5
    steps:
      # No checkout, but not no repository: see the `git init` in the script.
      # ls-remote genuinely needs neither, the delete push needs the second.
      - name: Delete the head branch
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail
          # Same token-in-URL form ci.yml's manual checkout uses. Nothing here
          # prints a command line, so the redaction helper the node version
          # needed has no counterpart: git's own errors do not echo the URL.
          remote="${SERVER/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${REPO}.git"
          ref="refs/heads/$BRANCH"

          # `git push` has to run from inside a repository even when the
          # remote is a full URL and the push only deletes a ref: it reads
          # local config and refs before it ever contacts the remote. On the
          # merge of #38 this job had no repository to run from and the push
          # failed with "fatal: not a git repository (or any parent up to
          # mount point /workspace/bjorn)", so every delete went down the
          # API fallback below - the one path #172 says cannot be trusted.
          #
          # An empty `git init` is enough. A delete pushes no objects, so
          # there is nothing for the repository to contain; it exists only to
          # give git a place to stand. `git ls-remote` needs no repository at
          # all, which is why the checks worked from the bare workspace and
          # the removal did not.
          #
          # nixfleet's copy of this file has the same shape and its pushes
          # succeed, because its workspace happens to carry a .git from an
          # earlier job on the same runner. That is luck, not a difference in
          # the file. Reported as nixfleet #192.
          git init -q /tmp/delete-repo
          cd /tmp/delete-repo

          # The only question this job ever asks, and it asks git.
          present() { [ -n "$(git ls-remote --heads "$remote" "$ref")" ]; }

          if ! present; then
            # The merge dialog's own checkbox, or a manual sweep, got here
            # first. That is the desired end state, not a failure.
            echo "$BRANCH is already gone"
            exit 0
          fi

          if ! git push "$remote" --delete "$ref"; then
            # See the header: this exists for the unproven case where the
            # actions token cannot delete refs over git. It is loud on purpose
            # - if this line ever appears, the assumption was wrong and the
            # header should be corrected rather than the noise tolerated.
            echo "git push --delete was refused, falling back to the API" >&2
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: token $TOKEN" \
              "$API/branches/$(printf '%s' "$BRANCH" | sed 's|/|%2F|g')")
            # No `|| echo 000` on that curl: -w already prints 000 when it
            # cannot connect, so the fallback appended a second one and the
            # line read "answered 000000". nixfleet carries that; reported
            # as nixfleet #190.
            echo "API DELETE answered ${code:-000}" >&2
          fi

          # A 2xx from either path is not evidence of anything - that is the
          # #172 finding. Ask git.
          if present; then
            echo "$BRANCH SURVIVED the delete (still on the remote per git)" >&2
            exit 1
          fi

          # ONE DELAYED RE-CHECK, for this repo's own unexplained observation:
          # on the merge of #28 (logged in #27) `git ls-remote` reported
          # herd/verify-with-git absent at 18:27:11 and stably present again at
          # 18:29:04, at the original sha. #172 accounts for every other case
          # as the database being wrong while git stayed put, and those are
          # caught above; it does not account for this one. Fifteen seconds
          # does not cover a two-minute lag, so this is a cheap catch and not a
          # guarantee - the backstop for the long tail is a periodic sweep,
          # which is #29.
          sleep 15
          if present; then
            echo "$BRANCH came back within 15s of a delete git confirmed" >&2
            exit 1
          fi

          echo "deleted $BRANCH"
