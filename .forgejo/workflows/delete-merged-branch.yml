# Deletes the head branch when a pull request merges. The forge-native way to
# do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo,
# where it can be read and changed without admin rights.
#
# Only branches under herd/ are touched, and only when the PR actually merged.
# A closed-unmerged PR, anyone else's branch and main are all left alone.
#
# EVERYTHING HERE HAPPENS OVER THE GIT TRANSPORT, because the forge's database
# is the surface that lies and git is the one every clone actually uses.
#
# TWO FAULTS PRODUCE THE SAME END STATE, which is why this took five attempts
# to characterise: a branch present on every git-reading surface and absent
# from `GET /branches`, the one surface that reads the branch table.
#
#   A. The database deletion happens and the git ref write does not. A DELETE
#      answers 2xx and marks the branch row deleted while `refs/heads/<branch>`
#      never moves. nixfleet #172, measured on bjorn/lokalverket-no:
#
#        GET /git/refs/heads -> herd/check-tests, herd/deps-credential-precheck, main
#        GET /branches       -> main
#
#   B. Both deletions happen, and then the forge puts the ref back. rovar-no
#      #42 and nixfleet #194, read on the pi-rovar host on 2026-09-15 from the
#      merge of this repo's #40: the delete went through receive-pack at
#      09:24:54.637, and the loose ref was BORN again at 09:24:56.412 - 1.8
#      seconds later - with `packed-refs` untouched from the day before and a
#      single reflog entry reading
#
#        0000000... 51b3348 Gitea <gitea@fake.local> ... update by push
#
#      The zeros mean creation from nothing, so the delete really took. No
#      `git-receive-pack` appears in the HTTP log for that window, and
#      `gitea@fake.local` is the forge's own identity rather than a pusher's,
#      so the restoring write came from inside the forge process. The branch
#      table deletion is not undone, which is how B lands on A's end state.
#
# Reading the end state cannot tell them apart. That is the whole reason #172
# concluded, correctly for the specimens it had, that the ref is never actually
# deleted - and why this file's header said so until the host-side read.
#
# What matters here is that BOTH are answered by the same design. Ask git, not
# the API, because in A the API has already been fooled - which is exactly how
# this file's #17 version logged `deleted` over a ref that was still there on
# PR #23. Then, if the ref is there, DELETE IT AGAIN, because a second delete
# against a ref already in that state is measured to stick (#44, two instances:
# a hand-run removal watched for 3m14s against an untouched control, and the
# 2026-09-16 sweep clearing the last specimen). Converging is how the branch
# actually goes away.
#
# AND THEN GO RED ANYWAY. That is the part this file got wrong between #45 and
# now, and it is worth being exact about which half was wrong, because the
# reasoning that produced it is still persuasive and still written below.
#
# The argument for ending green was: the branch is not lost, nothing is wrong
# except the forge's timing, and a watchdog that cries wolf on half its runs
# gets muted - #27's thread says exactly that about a different check. The
# CONCLUSION was wrong because the PREMISE was. "Nothing is wrong except the
# forge's timing" was never measured; it was inferred from the end state being
# harmless here. Bjørn withdrew it on #44 on 2026-09-16: the same signature on
# two other repos in this fleet accompanied three merges being rolled back
# silently. That report is his, from hosts this session cannot reach, and it is
# recorded here as attribution rather than as something re-measured - but a
# write into `refs/heads/` that nobody can explain is not a cosmetic quirk, and
# a quirk was the only thing that made green defensible.
#
# So the loop below converges AND reports. The ref gets deleted until git says
# it is gone, and if that took more than one attempt the job exits non-zero
# with the count. Red now means "something wrote into refs/heads/ behind us",
# which is true whether or not the branch survived it, and the muting risk is
# accepted deliberately: the fix for a red tick on every other merge is to
# explain the writer, not to stop printing the tick.
#
# THE MECHANISM IS OPEN. Do not fill this space in from nixfleet #194 without
# re-testing there: that issue's explanation was corrected three times and the
# last version, a push mirror's `fetch = +refs/*:refs/*` refspec writing
# branches back, was retracted by its own author on 2026-09-16 with a
# reproduction that failed on two git versions against a passing positive
# control. Its follow-on advice, "if the delete job starts going red again,
# check the remote's fetch refspec first", is explicitly NOT repeated here. The
# refspec is gone from this repo's mirror either way, which was right for a
# different reason, and this session could not check that it stayed gone:
# `GET /push_mirrors` answers 403 without repo admin, and herd has no host
# access to read the bare repo's config.
#
# WHETHER THE FAULT STILL FIRES IS OPEN, and this file deliberately does not
# say how often. #44 is the tally and `npm run retries:check` reads it out of
# the job logs; a count written in here would be stale on the next merge, and
# the version of this paragraph that tried it was falsified by the merge of the
# very PR that added it (#48, fixed in #49). Ask the logs, not the comment.
#
# Three things to know before reading a run of green ticks as a fix:
#
#   - Absence of the fault is not evidence of its absence. It was absent from
#     #41 as well, in the same morning that produced both occurrences, so a
#     quiet week says nothing on its own. (#38 is not a fourth data point for
#     that morning: its push hit the missing repository of #39 and the branch
#     went down the API fallback, so it never exercised this path at all.)
#   - A green tick does not even show which version of this job ran. A clean run
#     prints `deleted <branch> (1 attempt(s))` and goes green under the one-shot
#     code, under #45's loop and under this one alike. Only a merge where the ref
#     comes back distinguishes them.
#   - THE BRANCH STILL BEING THERE PROVES NOTHING UNTIL THIS JOB HAS RUN, and
#     "has run" is not "was merged a minute ago". See below.
#
# HOW LONG TO WAIT BEFORE CALLING A LEFTOVER BRANCH A FAULT. This is the trap
# that catches a human reader rather than the job, and the numbers are wider
# than anyone guesses. Observed range from the job logs, over every merge this
# job had carried to a normal verdict as of 2026-09-18 (#44 has the table). The
# two occurrences are excluded on purpose: a run that exits early on the fault
# is not measuring how long a healthy delete takes, and #43's gave up 0.17 s
# after the push. These are what was seen, not a bound - a busier queue widens
# the first row and the third with it.
#
#   merge -> the delete push     1.97 s .. 892.58 s
#   the delete push -> verdict   15.27 s .. 15.34 s
#   merge -> branch really gone  17.31 s .. 907.88 s
#
# The second row is this job's own two sleeps and is near enough a constant.
# The first row is the RUNNER QUEUE - one runner across seven repos, as the
# cron comment below says - and it is the entire spread: on #46 the delete push
# went out 14 minutes 52 seconds after the merge. For most of that time the
# branch is on the remote because nothing has tried to delete it yet, which is
# indistinguishable, from the outside, from the forge having put it back.
#
# So: do not read a branch listing to decide whether the fault fired. Read the
# job log. `npm run retries:check` does exactly that, and the delete job's own
# exit code is the other honest surface. A by-hand check of the remote is only
# worth anything once the run for that merge shows a verdict line - before that
# it is measuring the queue.
#
# This also retires the previous header's other half, which said the ref flaps
# and therefore no read path could ever settle it, so only a sweep could work.
# The right half of that was the diagnosis, not the remedy: the ref does move
# under you, and the answer is to keep deleting rather than to keep looking.
# The sweep is the same convergence over a day instead of twenty seconds, and
# it remains the backstop for what lands after the job exits.
#
#   #8   trusted the DELETE status   - Forgejo answers 500, not 404, for a
#                                      branch that is already gone
#   #17  checked with a REST GET     - on PR #23 the API said gone twice while
#                                      the ref survived
#   #28  checked with git ls-remote  - right surface, but it kept the API
#                                      DELETE as the thing doing the removal
#
# `git push --delete` is the only removal path with a clean record here: every
# stuck ref cleared by hand was cleared with it, #172's probing put 30 refs
# through in one push with the branch table staying in step, and it treats an
# already-gone ref benignly (a warning and exit 0) where the API answers 500.
#
# The API DELETE survives only as a fallback. It was added for the one thing
# not verifiable from outside the runner - whether the automatic `github.token`
# may delete refs over git - and that is now measured rather than assumed: the
# merges of #40 and #41 both pushed the ref away cleanly, with no fallback line
# in either log. It is kept anyway, because the first thing it actually caught
# was not a permission problem at all but the missing repository of #39, and a
# cleanup job that degrades is better than one that stops. Whichever path
# removes the ref, the verification below is the same.
#
# Ported from bjorn/nixfleet's copy of this file, which came from
# bjorn/media-tools (its #8/#9). Same `docker` label as every other job here,
# which carries git and curl; nothing in this version parses JSON, so the
# node-versus-python question the old header argued is moot.
#
# For whoever debugs this next: job logs ARE readable, at
# `GET /actions/jobs/{job_id}/logs`. An earlier version of this comment said
# they were not, which cost an hour. The trap is that `job_id` is a different id
# space from the `id` in `/actions/tasks`, and passing a task id there returns
# some other job's log rather than 404ing. Map it with `GET /actions/runs?limit=N`
# for the run's `id`, then `GET /actions/runs/{id}/jobs` for `{id, task_id}`.
name: Delete merged branch

on:
  pull_request:
    types: [closed]
  schedule:
    # 04:53 daily. Off the hour and clear of every slot this fleet already
    # uses: deps-update 04:37 here, merge-audit 05:13 here, link-check Wed
    # 06:00 here, and 04:17 and 04:41 taken by polybjorn-en and media-tools
    # for the same job. Capacity is 1 runner across seven repos, so these are
    # a real queue rather than a courtesy.
    - cron: '53 4 * * *'
  workflow_dispatch:

jobs:
  delete:
    # The guard is here rather than in the script now that #15's reason for
    # keeping it there is spent: a job that does not run is clearer in the run
    # list than a job that runs and decides to do nothing. `/actions/tasks` has
    # a `status` and no `conclusion`, so a skipped and a successful job still
    # read the same from that listing - map the run to its jobs instead.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'herd/')
    runs-on: docker
    timeout-minutes: 5
    steps:
      # No checkout, but not no repository: see the `git init` in the script.
      # ls-remote genuinely needs neither, the delete push needs the second.
      - name: Delete the head branch
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail
          # Same token-in-URL form ci.yml's manual checkout uses. Nothing here
          # prints a command line, so the redaction helper the node version
          # needed has no counterpart: git's own errors do not echo the URL.
          remote="${SERVER/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${REPO}.git"
          ref="refs/heads/$BRANCH"

          # `git push` has to run from inside a repository even when the
          # remote is a full URL and the push only deletes a ref: it reads
          # local config and refs before it ever contacts the remote. On the
          # merge of #38 this job had no repository to run from and the push
          # failed with "fatal: not a git repository (or any parent up to
          # mount point /workspace/bjorn)", so every delete went down the
          # API fallback below - the one path #172 says cannot be trusted.
          #
          # An empty `git init` is enough. A delete pushes no objects, so
          # there is nothing for the repository to contain; it exists only to
          # give git a place to stand. `git ls-remote` needs no repository at
          # all, which is why the checks worked from the bare workspace and
          # the removal did not.
          #
          # nixfleet's copy of this file has the same shape and its pushes
          # succeed, because its workspace happens to carry a .git from an
          # earlier job on the same runner. That is luck, not a difference in
          # the file. Reported as nixfleet #192.
          git init -q /tmp/delete-repo
          cd /tmp/delete-repo

          # The only question this job ever asks, and it asks git.
          present() { [ -n "$(git ls-remote --heads "$remote" "$ref")" ]; }

          if ! present; then
            # The merge dialog's own checkbox, or a manual sweep, got here
            # first. That is the desired end state, not a failure.
            echo "$BRANCH is already gone"
            exit 0
          fi

          # CONVERGENCE, NOT ONE SHOT. The forge restores refs it has just
          # deleted - #42 and nixfleet #194 - and the restore does not land at
          # a fixed offset, so no arrangement of checks can be made into a
          # guarantee. Measured here, both read on the host:
          #
          #   #40  ref reborn 1.775 s AFTER the delete
          #   #43  ref reborn 0.069 s BEFORE the push printed `- [deleted]`
          #
          # So: delete, wait, ask git, and delete again if it came back. Every
          # recorded manual removal of a stuck ref took, and the sweep's job is
          # the same convergence over a longer period. Bounded at four, because
          # if the forge restores the ref four times the loop is not going to
          # win and that is worth a look of a different kind.
          #
          # CONVERGING IS NOT THE SAME AS BEING SATISFIED. The loop's job is to
          # leave no branch behind; saying what happened is the exit code's job,
          # below the loop. Between #45 and #44's re-reading those were the same
          # decision, and collapsing them is what made a restored ref end green.
          attempt=0
          while :; do
            attempt=$((attempt + 1))

            if ! git push "$remote" --delete "$ref"; then
              # The API fallback. `github.token` deleting refs over git is
              # measured rather than assumed now (#40, #41), so this is here
              # for the case that stops being true, and for the one it did
              # catch: #39's missing repository.
              echo "git push --delete was refused, falling back to the API" >&2
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: token $TOKEN" \
                "$API/branches/$(printf '%s' "$BRANCH" | sed 's|/|%2F|g')")
              # No `|| echo 000` on that curl: -w already prints 000 when it
              # cannot connect, so the fallback appended a second one and the
              # line read "answered 000000". nixfleet carries that; reported
              # as nixfleet #190.
              echo "API DELETE answered ${code:-000}" >&2
            fi

            # A 2xx from either path is not evidence of anything - that is the
            # #172 finding. Ask git, and ask it late enough that a restore
            # racing the confirmation has already landed. Five seconds covers
            # both measurements above with room to spare.
            sleep 5
            present || break

            echo "attempt $attempt: $BRANCH is back 5s after a delete git accepted" >&2
            if [ "$attempt" -ge 4 ]; then
              echo "$BRANCH SURVIVED 4 delete attempts (still on the remote per git)" >&2
              exit 1
            fi
          done

          # One last look after a longer settle, keeping the coverage the old
          # 15-second re-check had. It is still not a guarantee: #28's ref came
          # back after two minutes, and nothing inside a job can wait that out.
          # The sweep below is what closes that, and it converges the same way
          # this loop does, over a day instead of twenty seconds.
          sleep 10
          if present; then
            echo "$BRANCH came back after the delete had settled ($attempt attempt(s))" >&2
            exit 1
          fi

          # The attempt count is the point of this line, not decoration: it is
          # what rovar-no #44 counts, and a run that needed three attempts is a
          # different day from one that needed one. It is also what
          # scripts/delete-retries-core.mjs anchors on, so the wording is not
          # free to change - and it is printed before the verdict below rather
          # than instead of it, so a red run still records what it cleared.
          echo "deleted $BRANCH ($attempt attempt(s))"

          # RED WHEN SOMETHING WROTE THE REF BACK, even though the branch is
          # gone and no work was lost. One attempt is a normal merge. More than
          # one means the delete git accepted was undone by a writer nobody in
          # this fleet can name yet, and that is the event #44 exists to count.
          # Deleting it again is the right response; ending green is not, and
          # the header says at length why that distinction took a detour.
          if [ "$attempt" -gt 1 ]; then
            restores=$((attempt - 1))
            echo "$BRANCH was put back $restores time(s) after a delete git accepted, and is gone now" >&2
            echo "failing on purpose: the branch is clean, the writer is unexplained - see rovar-no #44" >&2
            exit 1
          fi

  # THE BACKSTOP, AND THE REASON IT IS A SECOND SHAPE RATHER THAN A BETTER
  # VERSION OF THE JOB ABOVE. The delete job runs on `pull_request: closed`,
  # which covers the normal case and nothing else. An event-driven cleanup
  # cannot fail loudly when the event never arrives: a dropped event leaves the
  # branch behind forever, and the absence of a run is indistinguishable from
  # nothing to do. polybjorn-en's #70 merged and produced no delete run at all
  # while its #71 did, same repo and same forge, which is what this exists for.
  #
  # #29 originally argued for this on different grounds - that the ref itself
  # flapped, so no single observation could settle whether a branch was gone.
  # #172 disproved that; the delete job above is now a real fix rather than a
  # fifth guess. The sweep survives on the half of #29 that #172 does not touch:
  # a PR closed while the runner was down, a branch merged from the Mac, a job
  # cancelled mid-flight, an event the forge never delivered.
  #
  # Alongside the delete job, not instead of it. That one is what makes the
  # common case immediate; this only catches what it missed.
  #
  # THE SAFETY CONDITION IS ANCESTRY, NOT THE NAME. A branch is deleted only
  # when git says main already contains it. Deleting on the herd/ prefix alone
  # would eventually eat somebody's in-progress work: the prefix decides WHOSE
  # branches to consider, never whether one is finished.
  #
  # Liveness is checked, unlike in the three copies this is ported from: if this
  # timer stops firing the branches pile up in the same silence one layer up.
  # merge-audit.yml runs `npm run sweep:check` daily and fails when no sweep has
  # succeeded in 48 hours. It needs no schedule of its own that way, which
  # matters because a watchdog on its own timer needs its own watchdog.
  sweep:
    # Never on a merge. The delete job above already handles that, and a sweep
    # racing it would be two jobs deleting the same ref. This also means every
    # merge files a SKIPPED `sweep` task - sweep-freshness-core.mjs refuses to
    # count those as liveness, or merge traffic alone would keep it green.
    if: github.event_name != 'pull_request'
    runs-on: docker
    timeout-minutes: 10
    steps:
      # ANCESTRY COMES FROM GIT, NOT FROM THE COMPARE API. Forgejo's compare
      # path runs a pulls-unit permission lookup, and the automatic
      # `github.token` is the actions system user, which is no collaborator: it
      # answers 404 `Can't read pulls or can't read UnitTypeCode`. That token
      # reads and writes CODE fine, which is all this needs. nixfleet's copy
      # records hitting that wall on its first run.
      #
      # `merge-base --is-ancestor` is the honest form of the question anyway.
      # `--bare --filter=blob:none` keeps it cheap: commits and trees with no
      # file contents, because the question is about the commit graph and never
      # about file content.
      #
      # The clone also gives the delete push a repository to run from, which is
      # the thing the job above had to add a `git init` for - see #39.
      - name: Find merged herd/ branches
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone -q --bare --filter=blob:none \
            "${SERVER/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${REPO}.git" /tmp/sweep-repo
          cd /tmp/sweep-repo

          # `**`, NOT `*`. A single star does not match across a slash in a ref
          # pattern, so `refs/heads/herd/*` finds `herd/flat` and never sees
          # `herd/deps/bump` - the branch is simply absent from the candidate
          # list, the run reports `swept N` over the ones it did see, and the job
          # is green. Nothing would ever sweep it. #47, measured on git 2.54.0:
          #
          #   for-each-ref 'refs/heads/herd/*'   -> herd/flat
          #   for-each-ref 'refs/heads/herd/**'  -> herd/a/b/c, herd/deps/bump, herd/flat
          #
          # `git ls-remote` does NOT share the behaviour: a single star there
          # matches nested refs, which is part of why this survived - the
          # verification loop below would have been fine, and only the
          # enumeration was blind. Covered by test/sweep-glob.test.mjs, which
          # reads this pattern out of this file and runs it against a real
          # repository with nested branches rather than asserting the string.
          #
          # This makes the sweep SEE more branches, not delete more freely: the
          # ancestry check below is still what decides whether one is finished.
          total=0
          : > /tmp/merged.txt
          for b in $(git for-each-ref --format='%(refname:short)' 'refs/heads/herd/**'); do
            total=$((total + 1))
            if git merge-base --is-ancestor "$b" main; then
              printf '%s\n' "$b" >> /tmp/merged.txt
            else
              echo "keep   $b (not an ancestor of main)"
            fi
          done
          echo "$total candidate branch(es) under herd/, $(wc -l < /tmp/merged.txt) merged into main"

      # One push for all of them rather than one per branch: 30 refs went in a
      # single push during #172's probing with the branch table staying in step,
      # and git reports each ref's outcome separately, so nothing is lost by
      # batching. Verification is still per branch, because a push reporting
      # success is exactly the claim #172 established is worthless.
      - name: Delete them
        run: |
          set -uo pipefail
          cd /tmp/sweep-repo
          if [ ! -s /tmp/merged.txt ]; then
            echo "swept 0, failed 0"
            exit 0
          fi

          refs=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            refs+=("refs/heads/$name")
          done < /tmp/merged.txt

          # NOT `set -e` around this: a refused push must still be followed by
          # the per-branch verification below, which is what turns "the push
          # said something" into a real answer either way.
          git push origin --delete "${refs[@]}" || \
            echo "the delete push reported failure; verifying each branch anyway" >&2

          deleted=0
          failed=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -n "$(git ls-remote --heads origin "refs/heads/$name")" ]; then
              echo "$name SURVIVED the delete (still on the remote per git)" >&2
              failed=$((failed + 1))
            else
              echo "delete $name"
              deleted=$((deleted + 1))
            fi
          done < /tmp/merged.txt

          # Always a summary, including the nothing-to-do case: a run that
          # prints nothing is indistinguishable from one that did not happen.
          echo "swept $deleted, failed $failed"
          [ "$failed" -eq 0 ]
