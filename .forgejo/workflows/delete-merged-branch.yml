# Deletes the head branch when a pull request merges, and sweeps up daily what
# that missed. The forge-native way to do the first is the repo setting
# default_delete_branch_after_merge, which is admin-only and was never set;
# this is the same job as a file in the repo.
#
# The delete script is bjorn/ci-actions/delete-merged-branch@v1 since nixfleet
# #149, not a copy here - the same move the attribution job made. Five repos
# carried five versions of it and this one was the furthest ahead, so what the
# action owns now is everything this header used to argue: ask git and not the
# API, delete ONCE, and keep what the forge writes back as
# refs/specimens/<date>/<branch> rather than deleting it again, because a
# delete takes logs/refs/heads/<branch> with it and that reflog is the only
# thing that has ever separated the two faults. Its own header carries the
# measurements. The sweep below is unchanged and still honours the marker for
# seven days.
#
# `under_the_ref_lock` IS BACK, as the action's `ref-lock-probe` input, which
# this job turns on below. #67's receive-pack no-op left this repo when the
# delete script did, so for a day a preserved run reported what ls-remote saw
# and nothing more; #71 put it in the action and it is on here because this is
# the repo where the fault has actually fired. It is an input rather than the
# default because it needs curl, and an action in ci-actions may rely on bash,
# git, grep and mktemp and on nothing else.
#
# THE MECHANISM IS OPEN. Do not fill this space in from nixfleet #194 without
# re-testing there: that issue's explanation was corrected three times and the
# last version, a push mirror's `fetch = +refs/*:refs/*` refspec writing
# branches back, was retracted by its own author on 2026-09-16 with a
# reproduction that failed on two git versions against a passing positive
# control. Its follow-on advice, "if the delete job starts going red again,
# check the remote's fetch refspec first", is explicitly NOT repeated here.
#
# WHETHER THE FAULT STILL FIRES IS OPEN, and this file deliberately does not
# say how often. #44 is the tally and `npm run retries:check` reads it out of
# the job logs; a count written in here would be stale on the next merge, and
# the version of this paragraph that tried it was falsified by the merge of the
# very PR that added it (#48, fixed in #49). Ask the logs, not the comment.
#
# THE VERDICT WORDING IS NOW IN ANOTHER REPO, which is the one real cost of the
# move. scripts/delete-retries-core.mjs classifies a run by matching the last
# line the job prints, and those lines are the action's to change: a reworded
# `deleted <branch> (1 attempt(s))` would land in this repo's daily tally as
# `unknown` with nothing here to notice. Both sides know it - the action's own
# comment says the attempt count stays for this file's sake - and neither can
# assert it.
#
# HOW LONG TO WAIT BEFORE CALLING A LEFTOVER BRANCH A FAULT. This is the trap
# that catches a human reader rather than the job, and the numbers are wider
# than anyone guesses. Observed range from the job logs, over every merge this
# job had carried to a normal verdict as of 2026-09-18 (#44 has the table):
#
#   merge -> the delete push     1.97 s .. 892.58 s
#   the delete push -> verdict   15.27 s .. 15.34 s
#   merge -> branch really gone  17.31 s .. 907.88 s
#
# The second row is the job's own two sleeps and is near enough a constant.
# The first row is the RUNNER QUEUE - one runner across seven repos, as the
# cron comment below says - and it is the entire spread: on #46 the delete push
# went out 14 minutes 52 seconds after the merge. For most of that time the
# branch is on the remote because nothing has tried to delete it yet, which is
# indistinguishable, from the outside, from the forge having put it back. So do
# not read a branch listing to decide whether the fault fired; read the job log.
#
# A GREEN TICK DOES NOT SAY WHICH VERSION RAN. A clean run prints
# `deleted <branch> (1 attempt(s))` under the one-shot code, under #45's loop,
# under #48's and under the action alike. That is what the action's selftest is
# for: it runs ahead of the delete, against local bare repositories whose
# post-receive hook restores a deleted ref, so the step that goes green has
# exercised the paths no merge can be made to produce.
#
# For whoever debugs this next: job logs ARE readable, at
# `GET /actions/jobs/{job_id}/logs`. An earlier version of this comment said
# they were not, which cost an hour. The trap is that `job_id` is a different id
# space from the `id` in `/actions/tasks`, and passing a task id there returns
# some other job's log rather than 404ing. Map it with `GET /actions/runs?limit=N`
# for the run's `id`, then `GET /actions/runs/{id}/jobs` for `{id, task_id}`.
name: Delete merged branch

on:
  pull_request:
    types: [closed]
  schedule:
    # 04:53 daily. Off the hour and clear of every slot this fleet already
    # uses: deps-update 04:37 here, merge-audit 05:13 here, link-check Wed
    # 06:00 here, and 04:17 and 04:41 taken by polybjorn-en and media-tools
    # for the same job. Capacity is 1 runner across seven repos, so these are
    # a real queue rather than a courtesy.
    - cron: '53 4 * * *'
  workflow_dispatch:

jobs:
  delete:
    # The whole guard is here rather than in the action: a job that does not
    # run is clearer in the run list than a job that runs and decides to do
    # nothing. The action's `prefix` input refuses anything outside herd/ as a
    # belt, not as a replacement for this.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'herd/')
    runs-on: docker
    timeout-minutes: 5
    steps:
      # The full URL, including the port: a bare `bjorn/ci-actions/...` resolves
      # against DEFAULT_ACTIONS_URL, which is data.forgejo.org, not this forge.
      #
      # tally-issue is what #44 is open for. The action comments on it at the
      # moment a specimen is kept, because the sweep that expires the marker
      # runs at 04:53 and merge-audit's daily tally at 05:13 - a tally-only
      # notice would arrive twenty minutes after the specimen was taken.
      #
      # ref-lock-probe asks the forge, under the ref lock, whether a kept
      # specimen is really at the sha ls-remote advertised - #67's question,
      # answered from the refs rather than from the advertisement that can race.
      # It writes nothing in any outcome, which is the only reason it is allowed
      # near a specimen at all: #65's finding is that the reflog is the scarce
      # thing here. It decides nothing either - ls-remote stays the verdict, and
      # a forge that will not answer keeps the specimen and still exits non-zero.
      # Whether github.token is accepted on that endpoint is the one thing that
      # cannot be checked from outside a runner, so the first real specimen is
      # also the first time that half is known.
      - uses: https://git-ci.pebblecove.xyz:8447/bjorn/ci-actions/delete-merged-branch@v1
        with:
          token: ${{ github.token }}
          branch: ${{ github.event.pull_request.head.ref }}
          server-url: ${{ github.server_url }}
          repository: ${{ github.repository }}
          tally-issue: '44'
          ref-lock-probe: "true"

  # THE BACKSTOP, AND THE REASON IT IS A SECOND SHAPE RATHER THAN A BETTER
  # VERSION OF THE JOB ABOVE. The delete job runs on `pull_request: closed`,
  # which covers the normal case and nothing else. An event-driven cleanup
  # cannot fail loudly when the event never arrives: a dropped event leaves the
  # branch behind forever, and the absence of a run is indistinguishable from
  # nothing to do. polybjorn-en's #70 merged and produced no delete run at all
  # while its #71 did, same repo and same forge, which is what this exists for.
  #
  # #29 originally argued for this on different grounds - that the ref itself
  # flapped, so no single observation could settle whether a branch was gone.
  # #172 disproved that; the delete job above is now a real fix rather than a
  # fifth guess. The sweep survives on the half of #29 that #172 does not touch:
  # a PR closed while the runner was down, a branch merged from the Mac, a job
  # cancelled mid-flight, an event the forge never delivered.
  #
  # Alongside the delete job, not instead of it. That one is what makes the
  # common case immediate; this only catches what it missed.
  #
  # THE SAFETY CONDITION IS ANCESTRY, NOT THE NAME. A branch is deleted only
  # when git says main already contains it. Deleting on the herd/ prefix alone
  # would eventually eat somebody's in-progress work: the prefix decides WHOSE
  # branches to consider, never whether one is finished.
  #
  # Liveness is checked, unlike in the three copies this is ported from: if this
  # timer stops firing the branches pile up in the same silence one layer up.
  # merge-audit.yml runs `npm run sweep:check` daily and fails when no sweep has
  # succeeded in 48 hours. It needs no schedule of its own that way, which
  # matters because a watchdog on its own timer needs its own watchdog.
  sweep:
    # Never on a merge. The delete job above already handles that, and a sweep
    # racing it would be two jobs deleting the same ref. This also means every
    # merge files a SKIPPED `sweep` task - sweep-freshness-core.mjs refuses to
    # count those as liveness, or merge traffic alone would keep it green.
    if: github.event_name != 'pull_request'
    runs-on: docker
    timeout-minutes: 10
    steps:
      # ANCESTRY COMES FROM GIT, NOT FROM THE COMPARE API. Forgejo's compare
      # path runs a pulls-unit permission lookup, and the automatic
      # `github.token` is the actions system user, which is no collaborator: it
      # answers 404 `Can't read pulls or can't read UnitTypeCode`. That token
      # reads and writes CODE fine, which is all this needs. nixfleet's copy
      # records hitting that wall on its first run.
      #
      # `merge-base --is-ancestor` is the honest form of the question anyway.
      # `--bare --filter=blob:none` keeps it cheap: commits and trees with no
      # file contents, because the question is about the commit graph and never
      # about file content.
      #
      # The clone also gives the delete push a repository to run from, which is
      # the thing the job above had to add a `git init` for - see #39.
      - name: Find merged herd/ branches
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Where this job keeps its working state. Overridable so the sweep can
          # be RUN by a test rather than read by one - test/sweep-specimens.test.mjs
          # points it at a scratch directory and drives these two steps against
          # a real bare repository over file://. Unset, which is every real run,
          # it is /tmp exactly as before.
          W="${SWEEP_WORK:-/tmp}"
          mkdir -p "$W"

          git clone -q --bare --filter=blob:none \
            "${SERVER/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${REPO}.git" "$W/sweep-repo"
          cd "$W/sweep-repo"

          # `**`, NOT `*`. A single star does not match across a slash in a ref
          # pattern, so `refs/heads/herd/*` finds `herd/flat` and never sees
          # `herd/deps/bump` - the branch is simply absent from the candidate
          # list, the run reports `swept N` over the ones it did see, and the job
          # is green. Nothing would ever sweep it. #47, measured on git 2.54.0:
          #
          #   for-each-ref 'refs/heads/herd/*'   -> herd/flat
          #   for-each-ref 'refs/heads/herd/**'  -> herd/a/b/c, herd/deps/bump, herd/flat
          #
          # `git ls-remote` does NOT share the behaviour: a single star there
          # matches nested refs, which is part of why this survived - the
          # verification loop below would have been fine, and only the
          # enumeration was blind. Covered by test/sweep-glob.test.mjs, which
          # reads this pattern out of this file and runs it against a real
          # repository with nested branches rather than asserting the string.
          #
          # This makes the sweep SEE more branches, not delete more freely: the
          # ancestry check below is still what decides whether one is finished.
          total=0
          : > "$W/merged.txt"
          for b in $(git for-each-ref --format='%(refname:short)' 'refs/heads/herd/**'); do
            total=$((total + 1))
            if git merge-base --is-ancestor "$b" main; then
              printf '%s\n' "$b" >> "$W/merged.txt"
            else
              echo "keep   $b (not an ancestor of main)"
            fi
          done
          echo "$total candidate branch(es) under herd/, $(wc -l < "$W/merged.txt") merged into main"

          # SPECIMENS ARE HELD BACK, AND THE HOLD IS BOUNDED. The delete job
          # marks a branch the forge put back as refs/specimens/<date>/<branch>
          # and stops, because deleting the ref again erases the reflog that is
          # the only evidence telling #44's two faults apart. This is the other
          # half of that: a sweep that took the branch the next morning would
          # destroy the same evidence a few hours later instead of a few seconds
          # later, and the daily tally at 05:13 would then report it twenty
          # minutes after it was gone.
          #
          # A FAILED READ IS NOT AN ABSENT MARKER. Same lesson as the delete
          # job's `present()`, in the one place where getting it wrong means
          # sweeping the specimen this whole arrangement exists to keep: if the
          # marker list cannot be read, this step fails rather than proceeding
          # with an empty skip set, because an empty skip set and an unreadable
          # remote look identical and only one of them means "nothing to keep".
          if ! git ls-remote origin 'refs/specimens/*' > "$W/specimens.txt"; then
            echo "could not read the specimen markers, so this sweep cannot tell which branches to keep" >&2
            exit 1
          fi

          # Seven days, in the ref name rather than in any state this job would
          # have to keep. Long enough for a host-side read that needs a specific
          # person at a specific machine with root; short enough that a specimen
          # nobody reads cannot become the branch that lives forever, which is
          # the exact failure this sweep exists to catch.
          cutoff=$(date -u -d '7 days ago' +%F)
          : > "$W/keep.txt"
          : > "$W/expired.txt"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            marker=${line#*"$(printf '\t')"}
            rest=${marker#refs/specimens/}
            stamp=${rest%%/*}
            branch=${rest#*/}
            # A marker this job did not write, or one with a mangled name, is
            # expired rather than honoured. Keeping it would be the unbounded
            # case above, reached by a typo.
            case "$stamp" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *)
                echo "specimen marker $marker has no readable date, expiring it" >&2
                printf '%s\n' "$marker" >> "$W/expired.txt"
                continue ;;
            esac
            if [ "$stamp" \< "$cutoff" ]; then
              echo "specimen $branch expired (marked $stamp, cutoff $cutoff)"
              printf '%s\n' "$marker" >> "$W/expired.txt"
            else
              echo "keep   $branch (specimen marked $stamp, see rovar-no #44)"
              printf '%s\n' "$branch" >> "$W/keep.txt"
            fi
          done < "$W/specimens.txt"

          # Held-back branches come out of the delete list, and the expired
          # markers go in so a specimen and its marker leave together rather
          # than the marker outliving the branch it names.
          if [ -s "$W/keep.txt" ]; then
            grep -vxF -f "$W/keep.txt" "$W/merged.txt" > "$W/merged.filtered" || :
            mv "$W/merged.filtered" "$W/merged.txt"
          fi
          echo "$(wc -l < "$W/keep.txt") kept as specimen(s), $(wc -l < "$W/expired.txt") marker(s) expired"

      # One push for all of them rather than one per branch: 30 refs went in a
      # single push during #172's probing with the branch table staying in step,
      # and git reports each ref's outcome separately, so nothing is lost by
      # batching. Verification is still per branch, because a push reporting
      # success is exactly the claim #172 established is worthless.
      - name: Delete them
        run: |
          set -uo pipefail
          W="${SWEEP_WORK:-/tmp}"
          cd "$W/sweep-repo"
          [ -f "$W/expired.txt" ] || : > "$W/expired.txt"

          # Nothing to do now covers both lists: no merged branch to sweep and
          # no expired specimen marker to clear. Still reported rather than
          # silent, for the reason the summary at the bottom always prints.
          if [ ! -s "$W/merged.txt" ] && [ ! -s "$W/expired.txt" ]; then
            echo "swept 0, failed 0"
            exit 0
          fi

          # Branches first, then the expired markers, in the same push, so a
          # specimen and the marker naming it leave together rather than the
          # marker outliving the branch. An empty array under `set -u` aborts on
          # some bashes, which is why this is reached only once one of the two
          # lists above has something in it.
          refs=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            refs+=("refs/heads/$name")
          done < "$W/merged.txt"
          while IFS= read -r marker; do
            [ -n "$marker" ] || continue
            refs+=("$marker")
          done < "$W/expired.txt"

          # NOT `set -e` around this: a refused push must still be followed by
          # the per-branch verification below, which is what turns "the push
          # said something" into a real answer either way.
          git push origin --delete "${refs[@]}" || \
            echo "the delete push reported failure; verifying each branch anyway" >&2

          deleted=0
          failed=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -n "$(git ls-remote --heads origin "refs/heads/$name")" ]; then
              echo "$name SURVIVED the delete (still on the remote per git)" >&2
              failed=$((failed + 1))
            else
              echo "delete $name"
              deleted=$((deleted + 1))
            fi
          done < "$W/merged.txt"

          # Always a summary, including the nothing-to-do case: a run that
          # prints nothing is indistinguishable from one that did not happen.
          echo "swept $deleted, failed $failed"
          [ "$failed" -eq 0 ]
