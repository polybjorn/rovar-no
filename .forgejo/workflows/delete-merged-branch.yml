# Deletes the head branch when a pull request merges. The forge-native way to
# do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo,
# where it can be read and changed without admin rights.
#
# Only branches under herd/ are touched, and only when the PR actually merged.
# A closed-unmerged PR, anyone else's branch and main are all left alone.
#
# EVERYTHING HERE HAPPENS OVER THE GIT TRANSPORT, because the forge's database
# is the surface that lies and git is the one every clone actually uses.
#
# TWO FAULTS PRODUCE THE SAME END STATE, which is why this took five attempts
# to characterise: a branch present on every git-reading surface and absent
# from `GET /branches`, the one surface that reads the branch table.
#
#   A. The database deletion happens and the git ref write does not. A DELETE
#      answers 2xx and marks the branch row deleted while `refs/heads/<branch>`
#      never moves. nixfleet #172, measured on bjorn/lokalverket-no:
#
#        GET /git/refs/heads -> herd/check-tests, herd/deps-credential-precheck, main
#        GET /branches       -> main
#
#   B. Both deletions happen, and then the forge puts the ref back. rovar-no
#      #42 and nixfleet #194, read on the pi-rovar host on 2026-09-15 from the
#      merge of this repo's #40: the delete went through receive-pack at
#      09:24:54.637, and the loose ref was BORN again at 09:24:56.412 - 1.8
#      seconds later - with `packed-refs` untouched from the day before and a
#      single reflog entry reading
#
#        0000000... 51b3348 Gitea <gitea@fake.local> ... update by push
#
#      The zeros mean creation from nothing, so the delete really took. No
#      `git-receive-pack` appears in the HTTP log for that window, and
#      `gitea@fake.local` is the forge's own identity rather than a pusher's,
#      so the restoring write came from inside the forge process. The branch
#      table deletion is not undone, which is how B lands on A's end state.
#
# Reading the end state cannot tell them apart. That is the whole reason #172
# concluded, correctly for the specimens it had, that the ref is never actually
# deleted - and why this file's header said so until the host-side read.
#
# What matters here is that BOTH are answered by asking git rather than the
# API, because in A the API has already been fooled - which is exactly how this
# file's #17 version logged `deleted` over a ref that was still there on PR #23.
#
# THEN, IF THE REF IS THERE, KEEP IT. This file used to delete it again, up to
# four times, and a second delete against a ref in that state is genuinely
# measured to stick (#44, twice: a hand-run removal watched for 3m14s against an
# untouched control, and the 2026-09-16 sweep clearing the last specimen). It
# worked. It was still wrong, and #65 is the measurement that says why:
#
#   DELETING A REF DESTROYS ITS REFLOG. git 2.54.0, bare repo, logAllRefUpdates
#   on: after the delete, refs/heads/<branch> and logs/refs/heads/<branch> are
#   both gone, with no trailing sha->0000 entry left behind. Production agrees -
#   the 2026-09-15 specimen's reflog held EXACTLY ONE entry, stamped at the
#   restore, because that branch's own push and the delete two minutes later had
#   gone with the ref.
#
# That single zero-old-sha entry is the only thing that has ever told A and B
# apart. It is what proved the delete applied rather than silently doing
# nothing, which is the difference between "the forge restores refs" and "a
# successful receive-pack is not evidence of a ref write" - and the second of
# those would undermine every delete job in the fleet. The convergence loop
# erased it about five seconds after the restore and then went red asking for an
# investigation. Both specimens on record survived only because they predate the
# loop.
#
# So the branch is kept, marked as refs/specimens/<date>/<branch>, and the sweep
# below honours the marker for seven days. Cleanup is deferred, not abandoned.
# The branch was never the scarce thing here; the reflog is.
#
# AND THE KEPT BRANCH IS CHECKED AGAINST THE FORGE, NOT ONLY AGAINST THE
# ADVERTISEMENT. `git ls-remote` reads the ref advertisement a server sends at
# the start of a connection, which is a report about the refs rather than the
# refs - the same kind of surface #172 caught being wrong on the API's branch
# list, and the only kind this job had. A receive-pack command whose old and new
# values are both the sha just read is a no-op the server can accept only after
# taking the ref lock and finding that ref at that value, so it answers the
# question from the refs themselves and writes nothing whatever the answer. It
# runs on the preserve path only, it cannot change the verdict, and the detail
# is on `under_the_ref_lock` below. #67.
#
# AND SAY NOTHING ABOUT A REF NOBODY LOOKED AT PROPERLY. Two ways this job
# used to reach "the branch is gone" without establishing it, both on the
# already-gone path at the top of the script and both fixed there:
#
#   - `git ls-remote` prints nothing when the ref is absent and prints nothing
#     when it could not reach the remote. Testing the output alone made an
#     unreachable forge, or a token it would not take, read as a clean result -
#     a green tick over a remote the job never touched. The check a watchdog
#     cannot fail is the failure mode this repo keeps rediscovering.
#   - A ref somebody else deleted seconds ago is inside the restore window this
#     whole file is about, and a single read of it was the last conclusion here
#     drawn from one sample. It now gets the same settle and second look a ref
#     this job deleted itself gets, and if it is back, the job converges on it
#     and goes red like any other restore.
#
# AND THEN GO RED ANYWAY. That is the part this file got wrong between #45 and
# now, and it is worth being exact about which half was wrong, because the
# reasoning that produced it is still persuasive and still written below.
#
# The argument for ending green was: the branch is not lost, nothing is wrong
# except the forge's timing, and a watchdog that cries wolf on half its runs
# gets muted - #27's thread says exactly that about a different check. The
# CONCLUSION was wrong because the PREMISE was. "Nothing is wrong except the
# forge's timing" was never measured; it was inferred from the end state being
# harmless here. Bjørn withdrew it on #44 on 2026-09-16: the same signature on
# two other repos in this fleet accompanied three merges being rolled back
# silently. That report is his, from hosts this session cannot reach, and it is
# recorded here as attribution rather than as something re-measured - but a
# write into `refs/heads/` that nobody can explain is not a cosmetic quirk, and
# a quirk was the only thing that made green defensible.
#
# So the loop below converges AND reports. The ref gets deleted until git says
# it is gone, and if that took more than one attempt the job exits non-zero
# with the count. Red now means "something wrote into refs/heads/ behind us",
# which is true whether or not the branch survived it, and the muting risk is
# accepted deliberately: the fix for a red tick on every other merge is to
# explain the writer, not to stop printing the tick.
#
# THE MECHANISM IS OPEN. Do not fill this space in from nixfleet #194 without
# re-testing there: that issue's explanation was corrected three times and the
# last version, a push mirror's `fetch = +refs/*:refs/*` refspec writing
# branches back, was retracted by its own author on 2026-09-16 with a
# reproduction that failed on two git versions against a passing positive
# control. Its follow-on advice, "if the delete job starts going red again,
# check the remote's fetch refspec first", is explicitly NOT repeated here. The
# refspec is gone from this repo's mirror either way, which was right for a
# different reason, and this session could not check that it stayed gone:
# `GET /push_mirrors` answers 403 without repo admin, and herd has no host
# access to read the bare repo's config.
#
# WHETHER THE FAULT STILL FIRES IS OPEN, and this file deliberately does not
# say how often. #44 is the tally and `npm run retries:check` reads it out of
# the job logs; a count written in here would be stale on the next merge, and
# the version of this paragraph that tried it was falsified by the merge of the
# very PR that added it (#48, fixed in #49). Ask the logs, not the comment.
#
# Three things to know before reading a run of green ticks as a fix:
#
#   - Absence of the fault is not evidence of its absence. It was absent from
#     #41 as well, in the same morning that produced both occurrences, so a
#     quiet week says nothing on its own. (#38 is not a fourth data point for
#     that morning: its push hit the missing repository of #39 and the branch
#     went down the API fallback, so it never exercised this path at all.)
#   - A green tick does not even show which version of this job ran. A clean run
#     prints `deleted <branch> (1 attempt(s))` and goes green under the one-shot
#     code, under #45's loop and under this one alike. Only a merge where the ref
#     comes back distinguishes them.
#   - THE BRANCH STILL BEING THERE PROVES NOTHING UNTIL THIS JOB HAS RUN, and
#     "has run" is not "was merged a minute ago". See below.
#
# HOW LONG TO WAIT BEFORE CALLING A LEFTOVER BRANCH A FAULT. This is the trap
# that catches a human reader rather than the job, and the numbers are wider
# than anyone guesses. Observed range from the job logs, over every merge this
# job had carried to a normal verdict as of 2026-09-18 (#44 has the table). The
# two occurrences are excluded on purpose: a run that exits early on the fault
# is not measuring how long a healthy delete takes, and #43's gave up 0.17 s
# after the push. These are what was seen, not a bound - a busier queue widens
# the first row and the third with it.
#
#   merge -> the delete push     1.97 s .. 892.58 s
#   the delete push -> verdict   15.27 s .. 15.34 s
#   merge -> branch really gone  17.31 s .. 907.88 s
#
# The second row is this job's own two sleeps and is near enough a constant.
# The first row is the RUNNER QUEUE - one runner across seven repos, as the
# cron comment below says - and it is the entire spread: on #46 the delete push
# went out 14 minutes 52 seconds after the merge. For most of that time the
# branch is on the remote because nothing has tried to delete it yet, which is
# indistinguishable, from the outside, from the forge having put it back.
#
# So: do not read a branch listing to decide whether the fault fired. Read the
# job log. `npm run retries:check` does exactly that, and the delete job's own
# exit code is the other honest surface. A by-hand check of the remote is only
# worth anything once the run for that merge shows a verdict line - before that
# it is measuring the queue.
#
# This also retires the previous header's other half, which said the ref flaps
# and therefore no read path could ever settle it, so only a sweep could work.
# The right half of that was the diagnosis, not the remedy: the ref does move
# under you, and the answer is to keep deleting rather than to keep looking.
# The sweep is the same convergence over a day instead of twenty seconds, and
# it remains the backstop for what lands after the job exits.
#
#   #8   trusted the DELETE status   - Forgejo answers 500, not 404, for a
#                                      branch that is already gone
#   #17  checked with a REST GET     - on PR #23 the API said gone twice while
#                                      the ref survived
#   #28  checked with git ls-remote  - right surface, but it kept the API
#                                      DELETE as the thing doing the removal
#
# `git push --delete` is the only removal path with a clean record here: every
# stuck ref cleared by hand was cleared with it, #172's probing put 30 refs
# through in one push with the branch table staying in step, and it treats an
# already-gone ref benignly (a warning and exit 0) where the API answers 500.
#
# The API DELETE survives only as a fallback. It was added for the one thing
# not verifiable from outside the runner - whether the automatic `github.token`
# may delete refs over git - and that is now measured rather than assumed: the
# merges of #40 and #41 both pushed the ref away cleanly, with no fallback line
# in either log. It is kept anyway, because the first thing it actually caught
# was not a permission problem at all but the missing repository of #39, and a
# cleanup job that degrades is better than one that stops. Whichever path
# removes the ref, the verification below is the same.
#
# Ported from bjorn/nixfleet's copy of this file, which came from
# bjorn/media-tools (its #8/#9). Same `docker` label as every other job here,
# which carries git and curl; nothing in this version parses JSON, so the
# node-versus-python question the old header argued is moot.
#
# THE STEP BELOW IS RUN BY THE TEST SUITE, in test/delete-step.test.mjs. It
# lifts this `run:` block out of the YAML by its indentation and executes it
# against a stub git and a no-op sleep, so the paths no merge can produce on
# demand - a ref that comes back, a remote that will not answer, four restores
# in a row - are checked on every push. Two consequences for editing this file.
# Re-indenting the block, or moving the delete step below the sweep, breaks the
# extraction and the test says so rather than silently passing. And the wording
# of the verdict lines is load-bearing twice over now: scripts/
# delete-retries-core.mjs anchors on it, and that test asserts the tick and the
# tally agree about the same run.
#
# For whoever debugs this next: job logs ARE readable, at
# `GET /actions/jobs/{job_id}/logs`. An earlier version of this comment said
# they were not, which cost an hour. The trap is that `job_id` is a different id
# space from the `id` in `/actions/tasks`, and passing a task id there returns
# some other job's log rather than 404ing. Map it with `GET /actions/runs?limit=N`
# for the run's `id`, then `GET /actions/runs/{id}/jobs` for `{id, task_id}`.
name: Delete merged branch

on:
  pull_request:
    types: [closed]
  schedule:
    # 04:53 daily. Off the hour and clear of every slot this fleet already
    # uses: deps-update 04:37 here, merge-audit 05:13 here, link-check Wed
    # 06:00 here, and 04:17 and 04:41 taken by polybjorn-en and media-tools
    # for the same job. Capacity is 1 runner across seven repos, so these are
    # a real queue rather than a courtesy.
    - cron: '53 4 * * *'
  workflow_dispatch:

jobs:
  delete:
    # The guard is here rather than in the script now that #15's reason for
    # keeping it there is spent: a job that does not run is clearer in the run
    # list than a job that runs and decides to do nothing. `/actions/tasks` has
    # a `status` and no `conclusion`, so a skipped and a successful job still
    # read the same from that listing - map the run to its jobs instead.
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'herd/')
    runs-on: docker
    timeout-minutes: 5
    steps:
      # No checkout, but not no repository: see the `git init` in the script.
      # ls-remote genuinely needs neither, the delete push needs the second.
      - name: Delete the head branch
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          # Where a kept specimen announces itself. Scaffolding for #44 and it
          # goes when #44 does, same as merge-audit.yml's copy: unset, the job
          # keeps the branch and says so in the log, and only the notice is
          # lost. github.token is what comments here - FORGE_PR_TOKEN is the
          # other way round on this forge and 403s on issues.
          TALLY_ISSUE: '44'
        run: |
          set -uo pipefail
          # Same token-in-URL form ci.yml's manual checkout uses. Nothing here
          # prints a command line, so the redaction helper the node version
          # needed has no counterpart: git's own errors do not echo the URL.
          remote="${SERVER/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${REPO}.git"
          ref="refs/heads/$BRANCH"

          # `git push` has to run from inside a repository even when the
          # remote is a full URL and the push only deletes a ref: it reads
          # local config and refs before it ever contacts the remote. On the
          # merge of #38 this job had no repository to run from and the push
          # failed with "fatal: not a git repository (or any parent up to
          # mount point /workspace/bjorn)", so every delete went down the
          # API fallback below - the one path #172 says cannot be trusted.
          #
          # An empty `git init` is enough. A delete pushes no objects, so
          # there is nothing for the repository to contain; it exists only to
          # give git a place to stand. `git ls-remote` needs no repository at
          # all, which is why the checks worked from the bare workspace and
          # the removal did not.
          #
          # nixfleet's copy of this file has the same shape and its pushes
          # succeed, because its workspace happens to carry a .git from an
          # earlier job on the same runner. That is luck, not a difference in
          # the file. Reported as nixfleet #192.
          git init -q /tmp/delete-repo
          cd /tmp/delete-repo

          # The only question this job ever asks, and it asks git.
          #
          # A FAILED READ IS NOT AN ABSENT REF. `git ls-remote` prints nothing
          # and exits 0 when the ref is gone, and prints nothing and exits
          # non-zero when it could not reach the remote or was refused. The
          # one-liner this replaces tested the output alone, so a network blip
          # or a token the forge would not take read as "the branch is gone":
          # green tick, untouched remote, on the path right below this. Inside
          # the loop it is worse - it breaks out as if the delete had taken.
          # This job has one source of truth, and no answer from it is not an
          # answer.
          present() {
            local out
            if ! out=$(git ls-remote --heads "$remote" "$ref"); then
              echo "git ls-remote could not read the remote, so nothing here can say whether $BRANCH is gone" >&2
              exit 1
            fi
            [ -n "$out" ]
          }

          # ONE DELETE, THEN STOP. This job used to converge: delete, look,
          # delete again, up to four times. That was right about the branch and
          # wrong about the evidence.
          #
          # DELETING A REF DESTROYS ITS REFLOG. Measured on git 2.54.0 against a
          # bare repo with core.logAllRefUpdates on, which is how the forge
          # keeps these:
          #
          #   after push     refs/heads/herd/x  and  logs/refs/heads/herd/x
          #   after delete   both gone, and no trailing sha->0000 entry behind
          #
          # Production says the same, from the specimen this whole investigation
          # rests on. The 2026-09-15 restore of herd/header-says-what-172-found
          # was read on pi-rovar and its reflog held EXACTLY ONE entry, stamped
          # at the restore. That branch's own push at 10:19:11 and the delete at
          # 10:21:22 were both absent from it, so the delete had taken the
          # reflog with it and the restore wrote a fresh one.
          #
          # That single zero-old-sha entry is the only thing that has ever told
          # #44's two faults apart - it is what proved the delete applied rather
          # than silently doing nothing. AND THE CONVERGENCE LOOP DELETED IT. On
          # a real occurrence the second attempt lands about five seconds after
          # the restore, so the job erased the only evidence that could name the
          # writer and then went red asking for an investigation. Both specimens
          # on record survived only because they predate the loop: the
          # observe-only job left them where they were.
          #
          # So: delete once, and if something puts it back, STOP AND KEEP IT.
          # The branch is merged and clean, nothing is at risk from it sitting
          # there, and the sweep below still removes it - cleanup is deferred,
          # not abandoned. This is also what the repo owner asked for on
          # 2026-09-16 ("do not add the retry"), for a weaker reason than this
          # one: there, the retry hid the event. It also destroyed it.
          #
          # WHAT THIS GIVES UP, stated rather than glossed: a restored branch is
          # now removed by the sweep hours later instead of by this job in five
          # seconds. A second delete is measured to stick (#44, twice), so the
          # loop did work. It bought a faster cleanup at the price of the only
          # scarce thing here, and the branch was never the scarce thing.
          preserve() {
            local why="$1" sha marked=no lock_says
            sha=$(git ls-remote --heads "$remote" "$ref" | cut -f1) || sha=""

            # A marker ref rather than anything with state behind it. It keeps
            # the specimen out of the sweep without putting a second row in
            # anyone's branch list, and the date lives in the ref name so the
            # sweep can expire it while reading nothing but refs. Probed against
            # this forge on 2026-09-21: a custom namespace and a nested path are
            # both accepted and both read back through ls-remote.
            #
            # THE EMPTY-SHA GUARD IS NOT DECORATION. `git push remote :refs/x`
            # with nothing on the left is the delete refspec, so pushing an
            # unchecked "${sha}:refs/..." on a read that came back empty would
            # turn the line that preserves the specimen into one that removes a
            # ref. The read above can come back empty - that is the whole
            # subject of this file.
            if [ -z "$sha" ]; then
              echo "could not read a sha for $BRANCH, so it is not marked and the sweep takes it at 04:53" >&2
            elif git push "$remote" "${sha}:refs/specimens/$(date -u +%F)/$BRANCH"; then
              marked=yes
            else
              echo "could not mark $BRANCH as a specimen, so the sweep takes it at 04:53" >&2
            fi

            # Asked after the marker is written, so a slow or wedged probe can
            # never be the reason a specimen went unprotected. Skipped with no
            # sha, because the question needs a value to compare against.
            #
            # THE `||` IS LOAD BEARING, not a habit. This step runs under `-e`,
            # and a command substitution that exits non-zero takes the whole job
            # with it: made to return 1 deliberately, the probe turned every
            # preserve test in delete-step.test.mjs red, which is a specimen
            # dropped on the floor by the instrument that was added to examine
            # it. Nothing this function does is allowed to reach the verdict.
            lock_says="the forge was not asked whether $BRANCH is really there, for want of a sha to ask about"
            if [ -n "$sha" ]; then
              lock_says=$(under_the_ref_lock "$sha") \
                || lock_says="the probe for whether $ref is really there did not complete, so the ls-remote reading above is all there is"
            fi

            echo "$BRANCH KEPT as a specimen: $why" >&2
            echo "$lock_says" >&2
            printf '\n%s\n%s\n\n  R=%s\n  stat $R/refs/heads/%s\n  cat $R/logs/refs/heads/%s\n\n%s\n%s\n' \
              "Not deleting it again. The reflog is the evidence and a delete erases it." \
              "On pi-rovar, as root, while the ref is still there:" \
              "/var/lib/forgejo/git/repositories/$REPO.git" "$BRANCH" "$BRANCH" \
              "One entry with an all-zero old sha means the delete took and something recreated the ref." \
              "The Birth time against this job's push says whether the restore beat the push's own confirmation, which has never been the same twice (#40 +1.775s, #43 -0.069s)." >&2

            if [ "$marked" = yes ]; then
              echo "marked as a specimen, so the sweep leaves it alone until it expires" >&2
            fi
            echo "failing on purpose: the branch is clean and kept, the writer is unexplained - see rovar-no #44" >&2

            # Told at the moment it happens, because the daily tally cannot do
            # it. `retries:check` runs from merge-audit.yml at 05:13 and the
            # sweep runs at 04:53, so a tally reporting a live specimen would be
            # reporting it twenty minutes after the sweep had taken it, every
            # single time. Best effort: a forge that will not take the comment
            # must not change this job's verdict, which is decided above.
            if [ -n "${TALLY_ISSUE:-}" ] && [ -n "$sha" ]; then
              note="\`$BRANCH\` (\`$sha\`) was put back after a delete git accepted, and this job kept it instead of deleting it again. $why"
              note="$note\n\n$lock_says."
              note="$note\n\nA second delete erases the reflog, which is the only evidence that tells #44's two faults apart. Read it on pi-rovar as root while it is there:\n\n\`\`\`\nR=/var/lib/forgejo/git/repositories/$REPO.git\nstat \$R/refs/heads/$BRANCH\ncat \$R/logs/refs/heads/$BRANCH\n\`\`\`\n\nThe job log carries the push timings to compare the Birth time against."
              curl -sS -o /dev/null -X POST \
                -H "Authorization: token $TOKEN" \
                -H "Content-Type: application/json" \
                -d "$(printf '{"body":"%s"}' "$note")" \
                "$API/issues/$TALLY_ISSUE/comments" \
                || echo "could not comment on #$TALLY_ISSUE; the job log above is the record" >&2
            fi
            exit 1
          }

          # THE ADVERTISEMENT IS NOT THE REF. Every check above asks
          # `git ls-remote`, which reads the REF ADVERTISEMENT the server sends
          # at the start of a connection. That is a report about the refs rather
          # than the refs, and a surface that reports is a surface that can be
          # wrong - nixfleet #172 is this repo's own case of exactly that, on the
          # API's branch list, and the verdict above rests on the git side of the
          # same question from a single kind of read.
          #
          # There is one question the forge will answer from the refs themselves.
          # A receive-pack command whose old and new values are both the sha we
          # just read is a no-op, and the server can only accept it after taking
          # the ref lock and finding that ref at that value:
          #
          #   ref there, at that sha   ok <ref>
          #   ref there, at another    ng <ref> <the server's reason>
          #   ref not there            ng <ref> <the server's reason>
          #
          # It writes nothing in any of the three. Measured against this forge on
          # 2026-09-22 in all three states, with the ref and its reflog unchanged
          # after each, which is the only reason it is allowed anywhere near a
          # specimen: #65's whole finding is that the reflog is the scarce thing.
          # #67, and rovar-no #44 for the measurement.
          #
          # `git push` cannot ask it. `--force-with-lease=<ref>:` refuses
          # client-side off the advertisement without sending anything, so the
          # request is built here by hand. Two things that cost an hour each when
          # they were got wrong: the content type is
          # `application/x-git-receive-pack-request`, and the shorter
          # `application/x-git-receive-pack` answers 401 with an empty body,
          # which reads exactly like a credential fault and is not one.
          #
          # IT DECIDES NOTHING. The verdict is already made by the time this
          # runs and this cannot change it, including when it says the ref is not
          # there. A new instrument disagreeing with an old one on its first
          # outing is not grounds for believing the new one, and a job that went
          # from red to green on one reading from one probe would be the
          # single-sample conclusion this file has now removed twice.
          under_the_ref_lock() {
            local sha="$1" caps='report-status object-format=sha1' body out reason
            body=$(mktemp)
            {
              printf '%04x' "$(( 4 + ${#sha} + 1 + ${#sha} + 1 + ${#ref} + 1 + ${#caps} + 1 ))"
              printf '%s %s %s' "$sha" "$sha" "$ref"
              printf '\0%s\n' "$caps"
              printf '0000'
              # A delete pushes no objects and neither does a no-op, but the
              # protocol still wants a pack, so it gets an empty one.
              git pack-objects --stdout </dev/null 2>/dev/null || true
            } > "$body"

            out=$(curl -sS -m 30 --data-binary "@$body" \
              -H 'Content-Type: application/x-git-receive-pack-request' \
              -u "x-access-token:$TOKEN" \
              "$SERVER/$REPO.git/git-receive-pack" 2>&1) || out=''
            rm -f "$body"

            # ACCEPTED OR REFUSED, AND THE SERVER'S OWN WORDS FOR WHY. The
            # refusal reason is deliberately not matched against: it is not
            # stable across git versions, and this job does not control which
            # one the forge runs. git 2.54.0 refuses a moved ref with "incorrect
            # old value provided" where git 2.39.5 says "failed to update ref" -
            # found when this repo's CI image disagreed with the hypervisor
            # about it on #68. A case arm per phrasing would have read as "could
            # not ask the forge" the day the forge was upgraded, which is the
            # silent loss of the one check that had something to say. So the
            # split is accept versus refuse, which is where the meaning is, and
            # the reason is quoted rather than interpreted.
            case "$out" in
              *"ok $ref"*)
                echo "the forge confirms $BRANCH is on disk at $sha, so the reading above is the refs and not only the advertisement" ;;
              *"ng $ref"*)
                # sed rather than parameter expansion, because cutting at the
                # newline means writing one down and this block lives in YAML.
                # `|` as the delimiter, since the ref has slashes in it and
                # cannot have a pipe. `sed -n 1p` rather than `head -1` because
                # this runs under pipefail, where head closing the pipe early
                # would make the assignment non-zero on a script running under
                # -e, which is the one thing this function must never do.
                reason=$(printf '%s\n' "$out" | sed -n "s|.*ng $ref ||p" | sed -n 1p) || reason='no reason given'
                echo "the forge refused a no-op on $ref at the $sha ls-remote advertised (\"$reason\"), so the advertisement and the refs do not agree about this ref - #172's shape, on the git side. The verdict above stands anyway; see rovar-no #67" ;;
              *)
                echo "could not ask the forge whether $ref is really there, so the ls-remote reading above is all there is" ;;
            esac
            return 0
          }

          if ! present; then
            # The merge dialog's own checkbox, a sweep, or a removal by hand got
            # here first, which is the desired end state. But ONE READ IS NOT A
            # SETTLED STATE, and the rest of this file is that argument at
            # length: a ref this job deletes is never believed on the first
            # look, because the restore landed 1.775 s after one delete (#40)
            # and 0.069 s BEFORE another's own confirmation (#43). A ref
            # somebody else deleted seconds earlier sits in exactly that window,
            # so this was the one conclusion the job still drew from a single
            # sample - and it drew the cheerful one.
            sleep 10
            if ! present; then
              echo "$BRANCH is already gone"
              exit 0
            fi

            # A delete this job never issued was undone. That is the rarer of
            # the two specimens and #59 called it out as the one that would
            # narrow the mechanism: the writer cannot be reacting to anything
            # this job pushed, because this job has pushed nothing yet.
            preserve "it read as gone and was back 10s later, so a delete this job did not issue was undone"
          fi

          # ONE delete, then ask git twice. A 2xx from either path below is not
          # evidence of anything - that is the #172 finding - so the verdict
          # comes from ls-remote and from nothing else.
          if ! git push "$remote" --delete "$ref"; then
            # The API fallback. `github.token` deleting refs over git is
            # measured rather than assumed now (#40, #41), so this is here for
            # the case that stops being true, and for the one it did catch:
            # #39's missing repository.
            echo "git push --delete was refused, falling back to the API" >&2
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: token $TOKEN" \
              "$API/branches/$(printf '%s' "$BRANCH" | sed 's|/|%2F|g')")
            # No `|| echo 000` on that curl: -w already prints 000 when it
            # cannot connect, so the fallback appended a second one and the line
            # read "answered 000000". nixfleet carries that; reported as
            # nixfleet #190.
            echo "API DELETE answered ${code:-000}" >&2
          fi

          # Five seconds covers both measured restores with room to spare.
          sleep 5
          if present; then
            preserve "the forge put it back within 5s of a delete git accepted"
          fi

          # One last look after a longer settle, keeping the coverage the old
          # 15-second re-check had. It is still not a guarantee: #28's ref came
          # back after two minutes, and nothing inside a job can wait that out.
          # The sweep below is what closes that.
          sleep 10
          if present; then
            preserve "the forge put it back after the delete had settled"
          fi

          # The attempt count stays in this line although this job now only ever
          # makes one attempt. It is the anchor scripts/delete-retries-core.mjs
          # reads, four generations of logs are still inside the window it
          # reads, and dropping the count would make a new clean run
          # indistinguishable from a #38-era one that never recorded a count at
          # all. "Not recorded" and "one attempt" are different facts.
          echo "deleted $BRANCH (1 attempt(s))"

  # THE BACKSTOP, AND THE REASON IT IS A SECOND SHAPE RATHER THAN A BETTER
  # VERSION OF THE JOB ABOVE. The delete job runs on `pull_request: closed`,
  # which covers the normal case and nothing else. An event-driven cleanup
  # cannot fail loudly when the event never arrives: a dropped event leaves the
  # branch behind forever, and the absence of a run is indistinguishable from
  # nothing to do. polybjorn-en's #70 merged and produced no delete run at all
  # while its #71 did, same repo and same forge, which is what this exists for.
  #
  # #29 originally argued for this on different grounds - that the ref itself
  # flapped, so no single observation could settle whether a branch was gone.
  # #172 disproved that; the delete job above is now a real fix rather than a
  # fifth guess. The sweep survives on the half of #29 that #172 does not touch:
  # a PR closed while the runner was down, a branch merged from the Mac, a job
  # cancelled mid-flight, an event the forge never delivered.
  #
  # Alongside the delete job, not instead of it. That one is what makes the
  # common case immediate; this only catches what it missed.
  #
  # THE SAFETY CONDITION IS ANCESTRY, NOT THE NAME. A branch is deleted only
  # when git says main already contains it. Deleting on the herd/ prefix alone
  # would eventually eat somebody's in-progress work: the prefix decides WHOSE
  # branches to consider, never whether one is finished.
  #
  # Liveness is checked, unlike in the three copies this is ported from: if this
  # timer stops firing the branches pile up in the same silence one layer up.
  # merge-audit.yml runs `npm run sweep:check` daily and fails when no sweep has
  # succeeded in 48 hours. It needs no schedule of its own that way, which
  # matters because a watchdog on its own timer needs its own watchdog.
  sweep:
    # Never on a merge. The delete job above already handles that, and a sweep
    # racing it would be two jobs deleting the same ref. This also means every
    # merge files a SKIPPED `sweep` task - sweep-freshness-core.mjs refuses to
    # count those as liveness, or merge traffic alone would keep it green.
    if: github.event_name != 'pull_request'
    runs-on: docker
    timeout-minutes: 10
    steps:
      # ANCESTRY COMES FROM GIT, NOT FROM THE COMPARE API. Forgejo's compare
      # path runs a pulls-unit permission lookup, and the automatic
      # `github.token` is the actions system user, which is no collaborator: it
      # answers 404 `Can't read pulls or can't read UnitTypeCode`. That token
      # reads and writes CODE fine, which is all this needs. nixfleet's copy
      # records hitting that wall on its first run.
      #
      # `merge-base --is-ancestor` is the honest form of the question anyway.
      # `--bare --filter=blob:none` keeps it cheap: commits and trees with no
      # file contents, because the question is about the commit graph and never
      # about file content.
      #
      # The clone also gives the delete push a repository to run from, which is
      # the thing the job above had to add a `git init` for - see #39.
      - name: Find merged herd/ branches
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Where this job keeps its working state. Overridable so the sweep can
          # be RUN by a test rather than read by one - test/sweep-specimens.test.mjs
          # points it at a scratch directory and drives these two steps against
          # a real bare repository over file://. Unset, which is every real run,
          # it is /tmp exactly as before.
          W="${SWEEP_WORK:-/tmp}"
          mkdir -p "$W"

          git clone -q --bare --filter=blob:none \
            "${SERVER/https:\/\//https:\/\/x-access-token:${TOKEN}@}/${REPO}.git" "$W/sweep-repo"
          cd "$W/sweep-repo"

          # `**`, NOT `*`. A single star does not match across a slash in a ref
          # pattern, so `refs/heads/herd/*` finds `herd/flat` and never sees
          # `herd/deps/bump` - the branch is simply absent from the candidate
          # list, the run reports `swept N` over the ones it did see, and the job
          # is green. Nothing would ever sweep it. #47, measured on git 2.54.0:
          #
          #   for-each-ref 'refs/heads/herd/*'   -> herd/flat
          #   for-each-ref 'refs/heads/herd/**'  -> herd/a/b/c, herd/deps/bump, herd/flat
          #
          # `git ls-remote` does NOT share the behaviour: a single star there
          # matches nested refs, which is part of why this survived - the
          # verification loop below would have been fine, and only the
          # enumeration was blind. Covered by test/sweep-glob.test.mjs, which
          # reads this pattern out of this file and runs it against a real
          # repository with nested branches rather than asserting the string.
          #
          # This makes the sweep SEE more branches, not delete more freely: the
          # ancestry check below is still what decides whether one is finished.
          total=0
          : > "$W/merged.txt"
          for b in $(git for-each-ref --format='%(refname:short)' 'refs/heads/herd/**'); do
            total=$((total + 1))
            if git merge-base --is-ancestor "$b" main; then
              printf '%s\n' "$b" >> "$W/merged.txt"
            else
              echo "keep   $b (not an ancestor of main)"
            fi
          done
          echo "$total candidate branch(es) under herd/, $(wc -l < "$W/merged.txt") merged into main"

          # SPECIMENS ARE HELD BACK, AND THE HOLD IS BOUNDED. The delete job
          # marks a branch the forge put back as refs/specimens/<date>/<branch>
          # and stops, because deleting the ref again erases the reflog that is
          # the only evidence telling #44's two faults apart. This is the other
          # half of that: a sweep that took the branch the next morning would
          # destroy the same evidence a few hours later instead of a few seconds
          # later, and the daily tally at 05:13 would then report it twenty
          # minutes after it was gone.
          #
          # A FAILED READ IS NOT AN ABSENT MARKER. Same lesson as the delete
          # job's `present()`, in the one place where getting it wrong means
          # sweeping the specimen this whole arrangement exists to keep: if the
          # marker list cannot be read, this step fails rather than proceeding
          # with an empty skip set, because an empty skip set and an unreadable
          # remote look identical and only one of them means "nothing to keep".
          if ! git ls-remote origin 'refs/specimens/*' > "$W/specimens.txt"; then
            echo "could not read the specimen markers, so this sweep cannot tell which branches to keep" >&2
            exit 1
          fi

          # Seven days, in the ref name rather than in any state this job would
          # have to keep. Long enough for a host-side read that needs a specific
          # person at a specific machine with root; short enough that a specimen
          # nobody reads cannot become the branch that lives forever, which is
          # the exact failure this sweep exists to catch.
          cutoff=$(date -u -d '7 days ago' +%F)
          : > "$W/keep.txt"
          : > "$W/expired.txt"
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            marker=${line#*"$(printf '\t')"}
            rest=${marker#refs/specimens/}
            stamp=${rest%%/*}
            branch=${rest#*/}
            # A marker this job did not write, or one with a mangled name, is
            # expired rather than honoured. Keeping it would be the unbounded
            # case above, reached by a typo.
            case "$stamp" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *)
                echo "specimen marker $marker has no readable date, expiring it" >&2
                printf '%s\n' "$marker" >> "$W/expired.txt"
                continue ;;
            esac
            if [ "$stamp" \< "$cutoff" ]; then
              echo "specimen $branch expired (marked $stamp, cutoff $cutoff)"
              printf '%s\n' "$marker" >> "$W/expired.txt"
            else
              echo "keep   $branch (specimen marked $stamp, see rovar-no #44)"
              printf '%s\n' "$branch" >> "$W/keep.txt"
            fi
          done < "$W/specimens.txt"

          # Held-back branches come out of the delete list, and the expired
          # markers go in so a specimen and its marker leave together rather
          # than the marker outliving the branch it names.
          if [ -s "$W/keep.txt" ]; then
            grep -vxF -f "$W/keep.txt" "$W/merged.txt" > "$W/merged.filtered" || :
            mv "$W/merged.filtered" "$W/merged.txt"
          fi
          echo "$(wc -l < "$W/keep.txt") kept as specimen(s), $(wc -l < "$W/expired.txt") marker(s) expired"

      # One push for all of them rather than one per branch: 30 refs went in a
      # single push during #172's probing with the branch table staying in step,
      # and git reports each ref's outcome separately, so nothing is lost by
      # batching. Verification is still per branch, because a push reporting
      # success is exactly the claim #172 established is worthless.
      - name: Delete them
        run: |
          set -uo pipefail
          W="${SWEEP_WORK:-/tmp}"
          cd "$W/sweep-repo"
          [ -f "$W/expired.txt" ] || : > "$W/expired.txt"

          # Nothing to do now covers both lists: no merged branch to sweep and
          # no expired specimen marker to clear. Still reported rather than
          # silent, for the reason the summary at the bottom always prints.
          if [ ! -s "$W/merged.txt" ] && [ ! -s "$W/expired.txt" ]; then
            echo "swept 0, failed 0"
            exit 0
          fi

          # Branches first, then the expired markers, in the same push, so a
          # specimen and the marker naming it leave together rather than the
          # marker outliving the branch. An empty array under `set -u` aborts on
          # some bashes, which is why this is reached only once one of the two
          # lists above has something in it.
          refs=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            refs+=("refs/heads/$name")
          done < "$W/merged.txt"
          while IFS= read -r marker; do
            [ -n "$marker" ] || continue
            refs+=("$marker")
          done < "$W/expired.txt"

          # NOT `set -e` around this: a refused push must still be followed by
          # the per-branch verification below, which is what turns "the push
          # said something" into a real answer either way.
          git push origin --delete "${refs[@]}" || \
            echo "the delete push reported failure; verifying each branch anyway" >&2

          deleted=0
          failed=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            if [ -n "$(git ls-remote --heads origin "refs/heads/$name")" ]; then
              echo "$name SURVIVED the delete (still on the remote per git)" >&2
              failed=$((failed + 1))
            else
              echo "delete $name"
              deleted=$((deleted + 1))
            fi
          done < "$W/merged.txt"

          # Always a summary, including the nothing-to-do case: a run that
          # prints nothing is indistinguishable from one that did not happen.
          echo "swept $deleted, failed $failed"
          [ "$failed" -eq 0 ]
