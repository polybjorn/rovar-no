# Deletes the head branch when a pull request merges. The forge-native way to
# do this is the repo setting default_delete_branch_after_merge, which is
# admin-only and was never set; this is the same job as a file in the repo,
# where it can be read and changed without admin rights.
#
# Only branches under herd/ are touched, and only when the PR actually merged.
# A closed-unmerged PR, anyone else's branch and main are all left alone.
#
# STOP before adding a fifth check. This file was rewritten four times on
# 2026-09-14 and every version was superseded within hours:
#
#   #8   trusted the DELETE status     - Forgejo answers 500, not 404, for a
#                                        branch that is already gone
#   #17  checked with a REST GET       - on PR #23 the API said gone twice
#                                        while the ref survived
#   #28  checked with git ls-remote    - on its own merge ls-remote returned
#                                        empty and the ref was back two minutes
#                                        later, stably, at the original sha
#
# Each was correct about the failure it had seen. They fail together because
# the ref itself flaps: it can return after the job has exited, so nothing
# observed during the job settles the question, on any read path. The cause is
# tracked in nixfleet #172. The replacement shape - a periodic sweep, making
# correctness a repeated convergence rather than one true observation - is
# rovar-no #29, deliberately blocked behind #172.
#
# So: this job is a fast path that usually works, not a guarantee. A stray
# branch gets swept by hand with `git push origin --delete` after checking
# `git merge-base --is-ancestor`, which has held every time.
#
# The guard being in the script rather than the job `if:` is a lesser thing:
# `/actions/tasks` has a `status` and no `conclusion`, so from that listing a
# skipped job and a successful one read the same. It was not the cause of #15.
#
# For whoever debugs this next: job logs ARE readable, at
# `GET /actions/jobs/{job_id}/logs`. An earlier version of this comment said
# they were not, which cost an hour. The trap is that `job_id` is a different id
# space from the `id` in `/actions/tasks`, and passing a task id there returns
# some other job's log rather than 404ing. Map it with `GET /actions/runs?limit=N`
# for the run's `id`, then `GET /actions/runs/{id}/jobs` for `{id, task_id}`.
name: Delete merged branch

on:
  pull_request:
    types: [closed]

jobs:
  delete:
    runs-on: docker
    timeout-minutes: 5
    steps:
      # No checkout: the script is here and node's global fetch is in the
      # image. media-tools runs the same job on the `python` label with urllib
      # because that image guarantees the standard library; `docker` here is
      # node:22-bookworm, so fetch is the equivalent thing that cannot be
      # missing.
      - name: Delete the head branch
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          node - <<'JS'
          const { execFileSync } = require("node:child_process");

          const branch = process.env.BRANCH;
          // Escapes each segment and leaves the slashes as slashes, matching what
          // media-tools' urllib.parse.quote does by default. An earlier version of
          // this comment claimed an encoded slash does not resolve and would 404;
          // that was a guess and it is wrong. Measured on this repo (#20):
          // GET and DELETE both accept herd%2Ffoo, and the DELETE really deletes.
          // So a bare encodeURIComponent would work too. This form is kept only
          // because it keeps the branch readable in the URL and in the log line.
          const path = branch.split("/").map(encodeURIComponent).join("/");
          const url = `${process.env.API}/branches/${path}`;
          const auth = { Authorization: `token ${process.env.TOKEN}` };

          // The remote URL carries the token, and execFileSync puts the whole
          // command line into the message it throws. Without this, one failed
          // ls-remote prints the credential into a job log that anyone who can
          // read the repo can read. Every message goes through redact, not just
          // the ones that look like they might contain it.
          const redact = (msg) =>
            String(msg).split(process.env.TOKEN).join("***");

          const done = (msg) => { console.log(redact(msg)); process.exit(0); };
          const fail = (msg) => { console.log(redact(msg)); process.exit(1); };

          (async () => {
            if (process.env.MERGED !== "true") done(`PR closed without merging, leaving ${branch}`);
            if (!branch.startsWith("herd/")) done(`${branch} is not ours, leaving it`);

            const del = await fetch(url, { method: "DELETE", headers: auth });

            // Ask the ref store, not the API that was just asked to delete it.
            // #27: on PR #23 the DELETE returned 2xx AND the verification GET
            // returned 404, both saying the branch was gone, while the ref
            // survived - so checking the end state through the same API is not
            // a check. ls-remote goes over the git transport instead, which is
            // a different path on the server. git is on this image already:
            // /usr/bin/git shows up in checkout logs on the docker label.
            const remote = `${process.env.SERVER.replace("https://", `https://x-access-token:${process.env.TOKEN}@`)}/${process.env.REPO}.git`;
            const stillThere = () =>
              execFileSync("git", ["ls-remote", "--heads", remote, `refs/heads/${branch}`], {
                encoding: "utf8",
              }).trim() !== "";

            // Deliberately not branching on del.status. Forgejo 16.0.4 answers
            // 500 with an empty message when the branch is already gone, not
            // 404 - measured against this repo on 2026-09-14 - so the previous
            // version's "404 means someone got there first" arm was dead code
            // and the already-gone case landed in the failure arm. Asking what
            // is true now is both simpler and correct whatever the API answers.
            if (!stillThere()) {
              done(del.ok ? `deleted ${branch}` : `${branch} is gone (delete said ${del.status})`);
            }
            // Catches #15, where DELETE alone claimed success, and #27, where the
            // API agreed with itself twice. It does NOT catch what happened on
            // this file's own merge: ls-remote returned empty and the ref came
            // back. Nothing checked here can - see the header.
            fail(`${branch} is still in the ref store after DELETE answered ${del.status}`);
          })().catch((err) => fail(`could not delete ${branch}: ${err.message}`));
          JS
