# Test + build on the self-hosted runner (media-runner, docker label). This
# header named the image's node major for a year and was wrong by the time
# anyone read it, so it no longer does: the pins step below prints the major
# the job actually runs on, every run, which is a measurement rather than a
# comment. First workload of the 2026-08-21 Forgejo Actions pilot.
# GitHub Pages deploy stays in .github/workflows/deploy.yml, running off the
# push mirror - this job is the gate that runs on the forge the push actually
# lands on. `uses:` resolves via data.forgejo.org, not github.com.
#
# check-attribution.sh gates AI attribution in commit messages and PR
# descriptions: co-author trailers, generated-with lines, the per-session
# trailer a harness injects, and bare assistant URLs. CLAUDE.md says not to add
# these; an agent has followed a conflicting session-level instruction and
# added them anyway more than once regardless. Enforced by memory alone until
# this, and memory alone did not hold. Ported from dashboard's own gate, whose
# pattern covered only the first two shapes until 2026-09-11.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: docker
    # The job that runs on every push and every pull request, and the only one
    # here that talks to the npm registry. It had no ceiling of its own, so a
    # wedged `npm ci` ran until the runner stopped it. That backstop is 30
    # minutes, not the six hours an earlier version of this comment claimed:
    # nixfleet modules/forgejo-runner.nix sets `timeout = "30m"` and
    # `capacity = 1` (six hours is GitHub's hosted-runner default, which is why
    # the wrong number sounded right). Capacity 1 also means those 30 minutes
    # are 30 minutes of no CI for all seven repos, not just this one - confirmed
    # independently by 901 tasks across the seven with zero overlapping starts.
    # A green run here takes about 20 seconds, so 10 minutes is a wide margin
    # that still fails three times sooner than the backstop.
    timeout-minutes: 10
    # Bounds the fast-fail shape only: measured on the hypervisor, a refused
    # connection costs 70s by default and 10s with these set. It does NOT bound
    # a registry that accepts the connection and never answers - fetch-timeout
    # governs the HTTP response, not the TCP connect, so both settings blew past
    # a 150s ceiling in that shape. `timeout-minutes` above is the only thing
    # that bounds that one. See #24.
    env:
      npm_config_fetch_retries: 1
      npm_config_fetch_timeout: 15000
      # Has to stay above npm's mintimeout, which is 10s by default: npm refuses
      # the config outright with "minTimeout is greater than maxTimeout" and the
      # step fails for a reason unrelated to the network.
      npm_config_fetch_retry_maxtimeout: 20000
    steps:
      - uses: actions/checkout@v7
      # Before npm ci, because it needs no dependencies and because a node
      # disagreement is worth knowing about before spending the install on it.
      # It fails only when the deploy pin drops below the floor package.json
      # declares, not on a bare skew - see scripts/node-pins-core.mjs and #26
      # for why the narrow rule was the one chosen.
      - name: Check the node pins agree
        run: npm run pins:check
      - run: npm ci
        timeout-minutes: 5
      - run: npm test
      - run: npm run build

  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.event.pull_request.base.ref }}"
            ./check-attribution.sh commits "origin/${{ github.event.pull_request.base.ref }}..HEAD"
            exit 0
          fi
          # On a push, read what the push actually added. This used to be
          # `commits -1`, which on main is the merge commit and nothing else -
          # and a merge commit carries none of the trailers its parents do, so
          # anything that got past the pull_request job was invisible from then
          # on.
          zero=0000000000000000000000000000000000000000
          after=${AFTER:-HEAD}
          [ "$after" = "$zero" ] && after=HEAD
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..$after"
          else
            # First push of a branch, or a runner that does not hand us the
            # previous tip. For a merge this is the branch it merged in; for a
            # plain commit it is that commit, which is what the old form did.
            range="$after^1..$after"
          fi
          echo "Checking $range"
          ./check-attribution.sh commits "$range"
      - name: Check PR description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          ./check-attribution.sh body /tmp/pr-body.txt
