# Test + build on the self-hosted runner (media-runner, docker label). This
# header named the image's node major for a year and was wrong by the time
# anyone read it, so it no longer does: the pins step below prints the major
# the job actually runs on, every run, which is a measurement rather than a
# comment. First workload of the 2026-08-21 Forgejo Actions pilot.
# GitHub Pages deploy stays in .github/workflows/deploy.yml, running off the
# push mirror - this job is the gate that runs on the forge the push actually
# lands on. `uses:` resolves via data.forgejo.org, not github.com.
#
# The attribution gate is bjorn/ci-actions/attribution@v1 since nixfleet #149,
# not a script in this tree. It gates AI attribution in commit messages and PR
# descriptions: co-author trailers, generated-with lines, the per-session
# trailer a harness injects, and vendor URLs. CLAUDE.md says not to add these;
# an agent has followed a conflicting session-level instruction and added them
# anyway more than once regardless. The copy ported from dashboard asked for
# the vendor name after the colon, so the trailer carrying it in the KEY walked
# through; the action carries the widened pattern and a selftest ahead of it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: docker
    # The job that runs on every push and every pull request, and the only one
    # here that talks to the npm registry. It had no ceiling of its own, so a
    # wedged `npm ci` ran until the runner stopped it. That backstop is 30
    # minutes, not the six hours an earlier version of this comment claimed:
    # nixfleet modules/forgejo-runner.nix sets `timeout = "30m"` and
    # `capacity = 1` (six hours is GitHub's hosted-runner default, which is why
    # the wrong number sounded right). Capacity 1 also means those 30 minutes
    # are 30 minutes of no CI for all seven repos, not just this one - confirmed
    # independently by 901 tasks across the seven with zero overlapping starts.
    # A green run here takes about 20 seconds, so 10 minutes is a wide margin
    # that still fails three times sooner than the backstop.
    timeout-minutes: 10
    # Bounds the fast-fail shape only: measured on the hypervisor, a refused
    # connection costs 70s by default and 10s with these set. It does NOT bound
    # a registry that accepts the connection and never answers - fetch-timeout
    # governs the HTTP response, not the TCP connect, so both settings blew past
    # a 150s ceiling in that shape. `timeout-minutes` above is the only thing
    # that bounds that one. See #24.
    env:
      npm_config_fetch_retries: 1
      npm_config_fetch_timeout: 15000
      # Has to stay above npm's mintimeout, which is 10s by default: npm refuses
      # the config outright with "minTimeout is greater than maxTimeout" and the
      # step fails for a reason unrelated to the network.
      npm_config_fetch_retry_maxtimeout: 20000
    steps:
      - uses: https://git-ci.pebblecove.xyz:8447/bjorn/ci-actions/checkout@v1
        with:
          token: ${{ github.token }}
      # Before npm ci, because it needs no dependencies and because a node
      # disagreement is worth knowing about before spending the install on it.
      # It fails only when the deploy pin drops below the floor package.json
      # declares, not on a bare skew - see scripts/node-pins-core.mjs and #26
      # for why the narrow rule was the one chosen.
      - name: Check the node pins agree
        run: npm run pins:check
      # Offline dependency CVE gate. The scanner and the OSV databases are
      # cached on the runner HOST and bind-mounted read-only at /osv
      # (nixfleet modules/forgejo-runner.nix), so nothing about this repo's
      # package list reaches osv.dev.
      #
      # Before `npm ci`, so the tree it scans is exactly what the commit
      # carries: no node_modules and no dist, rather than a directory the
      # scanner has to be trusted to exclude. The cost is that an advisory
      # published overnight reds the run ahead of the tests, for a reason no
      # commit here caused; the answer to that is an `osv-scanner.toml` in the
      # repo root with an `[[IgnoredVulns]]` entry carrying an id and a reason,
      # which the scanner reads natively from the scanned directory.
      #
      # IT REFUSES RATHER THAN SKIPS - absent mount, absent scanner, empty or
      # week-old cache all fail the step - because osv-scanner prints a
      # clean-looking summary and reports zero findings when the cache answers
      # nothing. So a green tick here is not on its own evidence that the
      # database had content. What proves that is a call that MUST be refused,
      # and ci-actions' own three gate jobs make one against the same /osv
      # (bjorn/ci-actions#23, #24); a caller does not repeat it.
      - uses: https://git-ci.pebblecove.xyz:8447/bjorn/ci-actions/osv-scan@v1
      - run: npm ci
        timeout-minutes: 5
      - run: npm test
      - run: npm run build

  attribution:
    runs-on: docker
    timeout-minutes: 5
    steps:
      # One copy, in bjorn/ci-actions, replacing the seven this gate had
      # drifted into (nixfleet #149). No checkout step: the action does its own
      # in pure git, which is also what lets the same reference work on the
      # python and nix labels, where actions/checkout cannot run. The full URL
      # is required - a bare namespaced reference resolves to data.forgejo.org.
      - uses: https://git-ci.pebblecove.xyz:8447/bjorn/ci-actions/attribution@v1
        with:
          token: ${{ github.token }}
          event-name: ${{ github.event_name }}
          sha: ${{ github.sha }}
          base-ref: ${{ github.event.pull_request.base.ref }}
          before: ${{ github.event.before }}
          pr-body: ${{ github.event.pull_request.body }}

