# The spellchecker is English-only, and page copy is Norwegian and German
# prose. Left unexcluded it flags ordinary words ("alle", "sie", "Bord") in
# every translation, and each new language adds more.
[files]
extend-exclude = [
  "src/content/**",
  "src/i18n/ui/*.json",
  "docs/text-changes.yaml",
]

# Norwegian words outside the content tree: the month in season tests and
# hours scripts, and the original rovar.no slug in a stylesheet selector.
[default.extend-words]
juni = "juni"
meny = "meny"
